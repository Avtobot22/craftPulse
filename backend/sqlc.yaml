version: "2"
sql:
  - engine: postgresql
    schema: migrations/core
    queries: internal/repo/persistent/platform/queries.sql
    gen:
      go:
        package: platform
        out: internal/repo/persistent/platform
        sql_package: pgx/v5
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: timestamptz
            go_type: time.Time
