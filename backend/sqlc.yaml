version: "2"
overrides:
  go:
    overrides:
      - db_type: uuid
        go_type: github.com/google/uuid.UUID
      - db_type: uuid
        nullable: true
        go_type: github.com/google/uuid.NullUUID
      - db_type: timestamptz
        go_type: time.Time
sql:
  - engine: postgresql
    schema: migrations/core
    queries: internal/repo/persistent/platform/queries.sql
    gen:
      go:
        package: platform
        out: internal/repo/persistent/platform
        sql_package: pgx/v5
        omit_unused_structs: true
