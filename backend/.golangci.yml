version: "2"

run:
  timeout: 5m
  go: "1.27"
  tests: true

linters:
  default: none
  enable:
    # корректность
    - errcheck         # проверяет необработанные ошибки
    - govet            # официальные vet-проверки
    - staticcheck      # объединяет staticcheck + stylecheck + gosimple + unused
    - errorlint        # правильное использование %w, errors.Is/As
    - bodyclose        # http.Response.Body должен закрываться
    - sqlclosecheck    # rows/stmt должны закрываться
    - rowserrcheck     # после rows.Next() — проверка rows.Err()
    - nilerr           # return nil вместо return err по ошибке
    - exhaustive       # exhaustive switch на enum
    - copyloopvar      # для Go 1.22+ — старая ловушка с loop-var
    - contextcheck     # context передан вглубь
    - noctx            # HTTP-запрос без context.Context
    - unparam          # неиспользуемые параметры функции

    # стиль
    - revive           # современная замена golint
    - gocritic         # широкий набор проверок
    - misspell         # опечатки в комментариях
    - tagliatelle      # консистентность struct tags
    - whitespace       # лишние/недостающие пробелы
    - dupword          # дубликаты слов в комментариях

    # архитектура
    - depguard         # запрет импортов по правилам

    # производительность
    - prealloc         # подсказывает make([]T, 0, n)
    - perfsprint       # fmt.Sprintf где можно использовать strconv

    # безопасность
    - gosec            # security-anti-patterns

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: false
      exclude-functions:
        - (io.Closer).Close          # часто игнорируется явно
        - (*os.File).Close

    govet:
      enable-all: true
      disable:
        - fieldalignment             # шумно, оптимизация ради 4 байт обычно не стоит того
        - shadow                     # любим короткое shadowing err

    staticcheck:
      checks:
        - all

    revive:
      severity: warning
      rules:
        - name: exported
        - name: var-naming
        - name: package-comments
          disabled: true             # не требуем док. комментарий на пакет в каждом случае
        - name: error-return
        - name: error-naming
        - name: if-return
        - name: increment-decrement
        - name: range
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unused-parameter
          disabled: true             # уже покрыто unparam
        - name: redefines-builtin-id
        - name: confusing-naming
        - name: unused-receiver
        - name: early-return
        - name: receiver-naming

    gocritic:
      enabled-tags:
        - diagnostic
        - performance
        - style
      disabled-checks:
        - paramTypeCombine
        - ifElseChain
        - hugeParam                  # любим передавать структуры по значению, если они небольшие

    tagliatelle:
      case:
        rules:
          json: snake                # JSON-теги в snake_case
          yaml: snake
          env: upperSnake

    depguard:
      rules:
        main:
          deny:
            - pkg: "io/ioutil"
              desc: "io/ioutil deprecated since Go 1.16, use io and os"
            - pkg: "github.com/pkg/errors"
              desc: "use stdlib errors + fmt.Errorf with %w"
        pkg-isolation:
          files: ["**/pkg/**"]
          deny:
            - pkg: "github.com/Avtobot22/craftPulse/backend/internal/"
              desc: "pkg must not depend on internal packages"
        usecase-layers:
          files: ["**/internal/usecase/**"]
          deny:
            - pkg: "github.com/gin-gonic/gin"
              desc: "usecase must not depend on HTTP transport"
            - pkg: "github.com/jackc/pgx"
              desc: "usecase must use repository interfaces"
            - pkg: "github.com/Avtobot22/craftPulse/backend/internal/controller"
              desc: "usecase must not depend on controllers"
            - pkg: "github.com/Avtobot22/craftPulse/backend/internal/repo/"
              desc: "usecase must use repository interfaces"
        controller-isolation:
          files: ["**/internal/controller/**"]
          deny:
            - pkg: "github.com/Avtobot22/craftPulse/backend/internal/repo"
              desc: "controller must use usecase interfaces"
        adapter-isolation:
          files: ["**/internal/adapter/**"]
          list-mode: strict
          allow:
            - "$gostd"
            - "github.com/Avtobot22/craftPulse/backend/pkg/envelope$"
            - "github.com/Avtobot22/craftPulse/backend/pkg/envelope/"
            - "github.com/Avtobot22/craftPulse/backend/pkg/adaptersdk$"
            - "github.com/Avtobot22/craftPulse/backend/pkg/adaptersdk/"
        usecase-unknown-module:
          files: ["**/internal/usecase/**", "!**/internal/usecase/{org,install,auth,access,audit,connect,sync,ingest,normalize,link,process,calc,change,decision,docs,outbound,view,survey}/**"]
          deny:
            - pkg: "github.com/Avtobot22/craftPulse/backend/internal/usecase/"
              desc: "register new modules here before importing their own subpackages"
        usecase-org:
          files: ["**/internal/usecase/org/**"]
          list-mode: lax
          allow: ["github.com/Avtobot22/craftPulse/backend/internal/usecase/org$", "github.com/Avtobot22/craftPulse/backend/internal/usecase/org/"]
          deny:
            - pkg: "github.com/Avtobot22/craftPulse/backend/internal/usecase/"
              desc: "modules must be connected through interfaces in internal/app"
        usecase-install:
          files: ["**/internal/usecase/install/**"]
          list-mode: lax
          allow: ["github.com/Avtobot22/craftPulse/backend/internal/usecase/install$", "github.com/Avtobot22/craftPulse/backend/internal/usecase/install/"]
          deny:
