    gosec:
      excludes:
        - G104                       # дубли с errcheck
        - G304                       # file path provided as taint input — много false-positives

    exhaustive:
      default-signifies-exhaustive: true

    perfsprint:
      strconcat: false               # не настаивай на a+b вместо Sprintf

  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # тесты могут быть менее строгие
      - path: _test\.go
        linters:
          - errcheck
          - gosec
          - dupword
          - unparam
      # main.go — допускаем log.Fatal и Exit
      - path: cmd/.+/main\.go
        linters:
          - revive
        text: "exported function"

formatters:
  exclusions:
    generated: strict
  enable:
