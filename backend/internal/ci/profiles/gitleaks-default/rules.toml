# Appended to the pinned Gitleaks default rules. This marker grants access to nothing.
[[rules]]
id = "craftpulse-demo-secret"
description = "Training marker in the demo dataset"
regex = '''(?:defaultPartnerAPIKey|CRAFTPULSE_DEMO_SECRET)\s*[:=]\s*["']([A-Za-z0-9_-]{32})["']'''
secretGroup = 1
keywords = ["defaultPartnerAPIKey", "CRAFTPULSE_DEMO_SECRET"]
