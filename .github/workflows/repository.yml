name: Repository

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:
    inputs:
      target:
        description: Checks to run
        type: choice
        default: all
        options:
          - all
          - backend
          - integration
          - dataset
          - frontend
          - openapi
          - oci
          - shard-benchmark
      shards:
        description: Runner count for the integration target
        type: choice
        default: '2'
        options: ['1', '2', '4']

permissions:
  contents: read

concurrency:
  # Each main run has its own group, including pending runs between rapid pushes.
  group: repository-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  detect:
    name: detect
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      openapi: >-
        ${{ github.event_name == 'schedule' && 'true' || github.event_name == 'workflow_dispatch' && ((inputs.target == 'all' || inputs.target == 'openapi') && 'true' || 'false')
        || ((steps.filter.outputs.openapi == 'true') && 'true' || steps.filter.outputs.openapi-build) }}
      openapi-build: >-
        ${{ github.event_name == 'schedule' && 'true' || github.event_name == 'workflow_dispatch' && ((inputs.target == 'all' || inputs.target == 'openapi') && 'true' || 'false')
        || steps.filter.outputs.openapi-build }}
      backend: >-
        ${{ github.event_name == 'schedule' && 'true' || github.event_name == 'workflow_dispatch' && ((inputs.target == 'all' || inputs.target == 'backend') && 'true' || 'false')
        || ((steps.filter.outputs.dataset-source == 'true') && 'true' || steps.filter.outputs.backend) }}
      backend-integration: >-
        ${{ github.event_name == 'schedule' && 'true' || github.event_name == 'workflow_dispatch' && ((inputs.target == 'all' || inputs.target == 'backend' || inputs.target == 'integration') && 'true' || 'false')
        || ((steps.filter.outputs.dataset-source == 'true') && 'true' || steps.filter.outputs.backend) }}
      backend-image: >-
        ${{ github.event_name == 'schedule' && 'true' || github.event_name == 'workflow_dispatch' && ((inputs.target == 'all' || inputs.target == 'oci') && 'true' || 'false')
        || ((steps.filter.outputs.backend-source == 'true') && 'true' || steps.filter.outputs.backend-image) }}
      dataset: >-
        ${{ github.event_name == 'schedule' && 'true' || github.event_name == 'workflow_dispatch' && ((inputs.target == 'all' || inputs.target == 'dataset') && 'true' || 'false')
        || steps.filter.outputs.dataset }}
      frontend-checks: >-
        ${{ github.event_name == 'schedule' && 'true' || github.event_name == 'workflow_dispatch' && ((inputs.target == 'all' || inputs.target == 'frontend') && 'true' || 'false')
        || steps.filter.outputs.frontend-checks }}
      frontend-image: >-
        ${{ github.event_name == 'schedule' && 'true' || github.event_name == 'workflow_dispatch' && ((inputs.target == 'all' || inputs.target == 'frontend' || inputs.target == 'oci') && 'true' || 'false')
        || steps.filter.outputs.frontend-image }}
      release-metadata: >-
        ${{ github.event_name == 'schedule' && 'true' || github.event_name == 'workflow_dispatch' && ((inputs.target == 'all' || inputs.target == 'oci') && 'true' || 'false')
        || steps.filter.outputs.release-metadata }}
      release-adapters: >-
        ${{ github.event_name == 'schedule' && 'true' || github.event_name == 'workflow_dispatch' && ((inputs.target == 'all' || inputs.target == 'oci') && 'true' || 'false')
        || ((steps.filter.outputs.backend-source == 'true') && 'true' || steps.filter.outputs.release-adapters) }}
      release-profiles: >-
        ${{ github.event_name == 'schedule' && 'true' || github.event_name == 'workflow_dispatch' && ((inputs.target == 'all' || inputs.target == 'oci') && 'true' || 'false')
        || ((steps.filter.outputs.backend-source == 'true' || steps.filter.outputs.dataset-source == 'true') && 'true' || steps.filter.outputs.release-profiles) }}
      shard-benchmark: ${{ github.event_name == 'workflow_dispatch' && inputs.target == 'shard-benchmark' && 'true' || 'false' }}
    steps:
      # The pull request files API is capped at 3,000 files. Use Git for larger PRs and pushes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'push' || github.event.pull_request.changed_files >= 3000
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        id: filter
        with:
          token: ${{ github.event_name == 'pull_request' && github.event.pull_request.changed_files < 3000 && github.token || '' }}
          base: ${{ github.event_name == 'push' && github.ref || '' }}
          predicate-quantifier: some-with-excludes
          filters: |
            openapi:
              - 'docs/technical-specification/{technical-specification,mvp-scope}.md'
              - 'docs/requirements/{features,use-cases}.md'
              - 'demo-dataset/schemas/jenkins-execution.schema.json'
            openapi-build:
              - '.github/actions/go-cache/**'
              - 'scripts/openapi/**'
              - 'docs/technical-specification/*.yaml'
              - '.github/workflows/repository.yml'
            backend:
              - 'backend/**'
              - '!backend/{adapter.Dockerfile,ci.Dockerfile}'
              - '.github/actions/go-cache/**'
              - 'scripts/ci_shards.py'
              - 'scripts/ci-integration-timings.json'
              - 'deploy/postgres/**'
              - 'docs/technical-specification/{openapi,adapter,envelope}.yaml'
              - '.github/workflows/{repository,go-check,go-integration}.yml'
            # Production builds use the committed sources and generated code, without compiling Go tests.
            backend-source:
              - 'backend/**'
              - '!backend/**/*_test.go'
              - '!backend/{Dockerfile,adapter.Dockerfile,ci.Dockerfile}'
            backend-image:
              - '.github/actions/buildkit-cache/**'
              - 'backend/Dockerfile'
              - 'deploy/postgres/**'
              - 'scripts/check_release_server.py'
              - 'scripts/oci_release.py'
              - '.github/workflows/repository.yml'
            dataset:
              - 'demo-dataset/**'
              - '.github/actions/go-cache/**'
              - '.github/workflows/{repository,go-check}.yml'
            # The manifest test and docs-profile smoke test execute the dataset generator.
            dataset-source:
              - 'demo-dataset/{cmd,dataset}/**'
              - 'demo-dataset/go.{mod,sum}'
              - '!demo-dataset/**/*_test.go'
            frontend-checks:
              - 'frontend/**'
              - '!frontend/{Dockerfile,.dockerignore}'
              - 'docs/technical-specification/openapi.yaml'
              - '.github/workflows/repository.yml'
            frontend-image:
              - 'scripts/oci_release.py'
              - '.github/actions/buildkit-cache/**'
              - 'frontend/**'
              - '.github/workflows/repository.yml'
            release-metadata:
              - 'backend/**'
              - '!backend/**/*_test.go'
              - 'frontend/{Dockerfile,package-lock.json}'
              - 'scripts/oci_release.py'
              - '.github/release-tools.json'
              - '.github/workflows/{repository,oci-release}.yml'
            release-adapters:
              - '.github/actions/buildkit-cache/**'
              - 'backend/adapter.Dockerfile'
              - 'scripts/oci_release.py'
              - '.github/workflows/{repository,oci-release}.yml'
            release-profiles:
              - '.github/actions/buildkit-cache/**'
              - 'backend/ci.Dockerfile'
              # Profile smoke tests consume fixtures, including files named *_test.go.
              - 'backend/internal/ci/profiles/**'
              - 'scripts/check_*_profile.py'
              - 'scripts/oci_release.py'
              - '.github/workflows/{repository,oci-release}.yml'

  repository-check:
    name: repository-check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
          persist-credentials: false
      - name: Check repository, branch and commit titles
        run: python3 scripts/check_repository.py --event "$GITHUB_EVENT_PATH"
      - name: Test repository tooling
        run: python3 -m unittest discover -s tests -v

  openapi:
    needs: detect
    if: needs.detect.outputs.openapi == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.3.0'
          cache: npm
          cache-dependency-path: scripts/openapi/package-lock.json
      - name: Install OpenAPI checks
        run: npm --prefix scripts/openapi ci --ignore-scripts --no-audit --no-fund
      - name: Validate contract, examples and SRS operation map
        run: npm --prefix scripts/openapi run verify
      - uses: ./.github/actions/go-cache
        if: needs.detect.outputs.openapi-build == 'true'
        id: go-cache
        with:
          module: scripts/openapi
          mode: generators
          go-version: '1.27.0'
      - name: Generate and compile Go and TypeScript contracts
        if: needs.detect.outputs.openapi-build == 'true'
        run: npm --prefix scripts/openapi run generators
      - name: Build API documentation
        if: needs.detect.outputs.openapi-build == 'true'
        run: npm --prefix scripts/openapi run docs
      - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        if: needs.detect.outputs.openapi-build == 'true' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') && steps.go-cache.outputs.hit != 'true'
        continue-on-error: true
        with:
          path: ${{ steps.go-cache.outputs.path }}
          key: ${{ steps.go-cache.outputs.key }}

  backend:
    needs: detect
    if: needs.detect.outputs.backend == 'true'
    uses: ./.github/workflows/go-check.yml
    with:
      module: backend
      check-generated: true
      exclude-test-package: ./internal/app

  backend-integration:
    needs: detect
    if: needs.detect.outputs.backend-integration == 'true'
    uses: ./.github/workflows/go-integration.yml
    with:
      matrix: >-
        ${{ (github.event_name == 'workflow_dispatch' && inputs.target == 'integration' && inputs.shards == '1')
        && '[{"count":1,"index":0}]'
        || (github.event_name == 'workflow_dispatch' && inputs.target == 'integration' && inputs.shards == '4')
        && '[{"count":4,"index":0},{"count":4,"index":1},{"count":4,"index":2},{"count":4,"index":3}]'
        || '[{"count":2,"index":0},{"count":2,"index":1}]' }}
      save-cache: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}

  shard-benchmark:
    needs: detect
    if: needs.detect.outputs.shard-benchmark == 'true'
    uses: ./.github/workflows/go-benchmark.yml

  backend-image:
    needs: detect
    if: needs.detect.outputs.backend-image == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/buildkit-cache
      - name: Build server image
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: python3 scripts/oci_release.py build-server --sha "$COMMIT_SHA"
      - name: Verify server version on disposable PostgreSQL
        env:
          COMMIT_SHA: ${{ github.sha }}
        # The server only checks that the catalog names the CI step image by digest.
        run: >-
          python3 scripts/check_release_server.py --image "craftpulse-server:$COMMIT_SHA" --sha "$COMMIT_SHA"
          --ci-image "craftpulse-ci@sha256:$(printf '%064d' 0)"

  dataset:
    name: demo-dataset
    needs: detect
    if: needs.detect.outputs.dataset == 'true'
    uses: ./.github/workflows/go-check.yml
    with:
      module: demo-dataset
      build: true

  frontend-checks:
    needs: detect
    if: needs.detect.outputs.frontend-checks == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.3.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify generated API types
        run: npm run check:generated
      - name: Check formatting
        run: npm run format:check
      - name: Lint TypeScript and FSD boundaries
        run: npm run lint
      - name: Test frontend
        run: npm test

  frontend-image:
    needs: detect
    if: needs.detect.outputs.frontend-image == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/buildkit-cache
      # npm run build in the Dockerfile includes the theme check and strict TypeScript.
      - name: Build frontend image without publishing
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: python3 scripts/oci_release.py build-frontend --sha "$COMMIT_SHA"

  release-metadata:
    needs: detect
    if: needs.detect.outputs.release-metadata == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate release discovery and metadata
        run: python3 scripts/oci_release.py check

  release-adapters:
    needs: detect
    if: needs.detect.outputs.release-adapters == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/buildkit-cache
      - name: Build discovered adapter images without registry credentials
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: python3 scripts/oci_release.py build-adapters --sha "$COMMIT_SHA"

  release-profiles:
    needs: detect
    if: needs.detect.outputs.release-profiles == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/buildkit-cache
      - name: Build the CI step and profile images without registry credentials
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: python3 scripts/oci_release.py build-ci --sha "$COMMIT_SHA"

  ci:
    name: ci
    needs:
      - detect
      - repository-check
      - openapi
      - backend
      - backend-integration
      - shard-benchmark
      - backend-image
      - dataset
      - frontend-checks
      - frontend-image
      - release-metadata
      - release-adapters
      - release-profiles
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check required job results
        env:
          JOBS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import sys

          jobs = json.loads(os.environ["JOBS"])
          required = ("detect", "repository-check")
          affected = jobs["detect"].get("outputs", {})
          failures = []
          for name, job in jobs.items():
              result = job["result"]
              if result == "success":
                  continue
              if result == "skipped" and name not in required and affected.get(name) == "false":
                  continue
              failures.append(f"{name}: {result}")
          sys.exit("\n".join(failures) if failures else 0)
          PYTHON
