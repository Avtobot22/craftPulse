name: Repository

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Each main run has its own group, including pending runs between rapid pushes.
  group: repository-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  detect:
    name: detect
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      dataset: ${{ steps.filter.outputs.dataset }}
      frontend: ${{ steps.filter.outputs.frontend }}
      release: ${{ steps.filter.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          base: ${{ github.ref }}
          filters: |
            backend:
              - 'backend/**'
              - 'scripts/check_release_server.py'
              - 'deploy/postgres/**'
              - 'docs/technical-specification/openapi.yaml'
              - 'docs/technical-specification/adapter.yaml'
              - 'docs/technical-specification/envelope.yaml'
              - '.github/workflows/repository.yml'
              - '.github/workflows/go-check.yml'
            frontend:
              - 'frontend/**'
              - 'docs/technical-specification/openapi.yaml'
              - '.github/workflows/repository.yml'
            dataset:
              - 'demo-dataset/**'
              - '.github/workflows/repository.yml'
              - '.github/workflows/go-check.yml'
            release:
              - 'backend/**'
              - 'scripts/check_release_server.py'
              - 'frontend/Dockerfile'
              - 'frontend/package-lock.json'
              - 'scripts/oci_release.py'
              - 'scripts/check_code_profile.py'
              - 'scripts/check_sast_profile.py'
              - 'tests/test_oci_release.py'
              - '.github/release-tools.json'
              - '.github/workflows/oci-release.yml'
              - '.github/workflows/repository.yml'

  repository-check:
    name: repository-check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check repository, branch and commit titles
        run: python3 scripts/check_repository.py --event "$GITHUB_EVENT_PATH"
      - name: Test repository tooling
        run: python3 -m unittest discover -s tests -v
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.3.0'
          cache: npm
          cache-dependency-path: scripts/openapi/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.0'
          cache: false
      - name: Install OpenAPI checks
        run: npm --prefix scripts/openapi ci --ignore-scripts --no-audit --no-fund
      - name: Validate contract, examples and SRS operation map
        run: npm --prefix scripts/openapi run verify
      - name: Generate and compile Go and TypeScript contracts
        run: npm --prefix scripts/openapi run generators
      - name: Build API documentation
        run: npm --prefix scripts/openapi run docs

  backend:
    name: backend
    needs: detect
    if: github.event_name == 'workflow_dispatch' || needs.detect.outputs.backend == 'true'
    uses: ./.github/workflows/go-check.yml
    with:
      module: backend
      cache: true
      check-generated: true
      image: craftpulse-server

  dataset:
    name: demo-dataset
    needs: detect
    if: github.event_name == 'workflow_dispatch' || needs.detect.outputs.dataset == 'true'
    uses: ./.github/workflows/go-check.yml
    with:
      module: demo-dataset

  frontend:
    name: frontend
    needs: detect
    if: github.event_name == 'workflow_dispatch' || needs.detect.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.3.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify generated API types
        run: |
          npm run generate:api
          git diff --exit-code -- src/shared/api/generated/
          test -z "$(git ls-files --others --exclude-standard -- src/shared/api/generated/)"
      - name: Check formatting
        run: npm run format:check
      - name: Check strict TypeScript
        run: npm run typecheck
      - name: Lint TypeScript and FSD boundaries
        run: npm run lint
      - name: Test frontend
        run: npm test
      - name: Build static frontend
        run: npm run build
      - name: Build frontend image without publishing
        run: docker build --tag craftpulse-frontend:ci .

  release-check:
    name: release-check
    needs: detect
    if: github.event_name == 'workflow_dispatch' || needs.detect.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate release discovery and metadata
        run: python3 scripts/oci_release.py check
      - name: Build discovered adapter images without registry credentials
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: python3 scripts/oci_release.py build-adapters --sha "$COMMIT_SHA"
      - name: Build the CI step image without registry credentials
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: python3 scripts/oci_release.py build-ci --sha "$COMMIT_SHA"

  ci:
    name: ci
    needs: [detect, repository-check, backend, dataset, frontend, release-check]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check required job results
        env:
          DETECT: ${{ needs.detect.result }}
          REPOSITORY: ${{ needs.repository-check.result }}
          BACKEND: ${{ needs.backend.result }}
          BACKEND_CHANGED: ${{ needs.detect.outputs.backend }}
          DATASET: ${{ needs.dataset.result }}
          DATASET_CHANGED: ${{ needs.detect.outputs.dataset }}
          FRONTEND: ${{ needs.frontend.result }}
          FRONTEND_CHANGED: ${{ needs.detect.outputs.frontend }}
          RELEASE: ${{ needs.release-check.result }}
          RELEASE_CHANGED: ${{ needs.detect.outputs.release }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          [ "$DETECT" = success ] || { echo "detect: $DETECT"; exit 1; }
          [ "$REPOSITORY" = success ] || { echo "repository-check: $REPOSITORY"; exit 1; }
          case "$BACKEND" in
            success) ;;
            skipped)
              [ "$BACKEND_CHANGED" = false ] && [ "$EVENT_NAME" != workflow_dispatch ] || exit 1
              ;;
            *) echo "backend: $BACKEND"; exit 1 ;;
          esac
          case "$DATASET" in
            success) ;;
            skipped)
              [ "$DATASET_CHANGED" = false ] && [ "$EVENT_NAME" != workflow_dispatch ] || exit 1
              ;;
            *) echo "demo-dataset: $DATASET"; exit 1 ;;
          esac
          case "$FRONTEND" in
            success) ;;
            skipped)
              [ "$FRONTEND_CHANGED" = false ] && [ "$EVENT_NAME" != workflow_dispatch ] || exit 1
              ;;
            *) echo "frontend: $FRONTEND"; exit 1 ;;
          esac
          case "$RELEASE" in
            success) ;;
            skipped)
              [ "$RELEASE_CHANGED" = false ] && [ "$EVENT_NAME" != workflow_dispatch ] || exit 1
              ;;
            *) echo "release-check: $RELEASE"; exit 1 ;;
          esac
