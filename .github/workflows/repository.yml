name: Repository

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Each main run has its own group, including pending runs between rapid pushes.
  group: repository-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  detect:
    name: detect
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      dataset: ${{ steps.filter.outputs.dataset }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          base: ${{ github.ref }}
          filters: |
            backend:
              - 'backend/**'
              - 'deploy/postgres/**'
              - 'docs/technical-specification/openapi.yaml'
              - '.github/workflows/repository.yml'
              - '.github/workflows/go-check.yml'
            dataset:
              - 'demo-dataset/**'
              - '.github/workflows/repository.yml'
              - '.github/workflows/go-check.yml'

  repository-check:
    name: repository-check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check repository, branch and commit titles
        run: python3 scripts/check_repository.py --event "$GITHUB_EVENT_PATH"
      - name: Test repository tooling
        run: python3 -m unittest discover -s tests -v
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.3.0'
          cache: npm
          cache-dependency-path: scripts/openapi/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.0'
          cache: false
      - name: Install OpenAPI checks
        run: npm --prefix scripts/openapi ci --ignore-scripts --no-audit --no-fund
      - name: Validate contract, examples and SRS operation map
        run: npm --prefix scripts/openapi run verify
      - name: Generate and compile Go and TypeScript contracts
        run: npm --prefix scripts/openapi run generators
      - name: Build API documentation
        run: npm --prefix scripts/openapi run docs

  backend:
    name: backend
    needs: detect
    if: github.event_name == 'workflow_dispatch' || needs.detect.outputs.backend == 'true'
    uses: ./.github/workflows/go-check.yml
    with:
      module: backend
      cache: true
      check-generated: true
      image: craftpulse-server

  dataset:
    name: demo-dataset
    needs: detect
    if: github.event_name == 'workflow_dispatch' || needs.detect.outputs.dataset == 'true'
    uses: ./.github/workflows/go-check.yml
    with:
      module: demo-dataset

  ci:
    name: ci
    needs: [detect, repository-check, backend, dataset]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check required job results
        env:
          DETECT: ${{ needs.detect.result }}
          REPOSITORY: ${{ needs.repository-check.result }}
          BACKEND: ${{ needs.backend.result }}
          BACKEND_CHANGED: ${{ needs.detect.outputs.backend }}
          DATASET: ${{ needs.dataset.result }}
          DATASET_CHANGED: ${{ needs.detect.outputs.dataset }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          [ "$DETECT" = success ] || { echo "detect: $DETECT"; exit 1; }
          [ "$REPOSITORY" = success ] || { echo "repository-check: $REPOSITORY"; exit 1; }
          case "$BACKEND" in
            success) ;;
            skipped)
              [ "$BACKEND_CHANGED" = false ] && [ "$EVENT_NAME" != workflow_dispatch ] || exit 1
              ;;
            *) echo "backend: $BACKEND"; exit 1 ;;
          esac
          case "$DATASET" in
            success) ;;
            skipped)
              [ "$DATASET_CHANGED" = false ] && [ "$EVENT_NAME" != workflow_dispatch ] || exit 1
              ;;
            *) echo "demo-dataset: $DATASET"; exit 1 ;;
          esac
