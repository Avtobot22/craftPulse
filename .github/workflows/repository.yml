name: Repository

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Each main run has its own group, including pending runs between rapid pushes.
  group: repository-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  detect:
    name: detect
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          base: ${{ github.ref }}
          filters: |
            backend:
              - 'backend/**'
              - 'deploy/postgres/**'
              - 'docs/technical-specification/openapi.yaml'
              - '.github/workflows/repository.yml'

  repository-check:
    name: repository-check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check repository, branch and commit titles
        run: python3 scripts/check_repository.py --event "$GITHUB_EVENT_PATH"
      - name: Test repository tooling
        run: python3 -m unittest discover -s tests -v
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26.3.0'
          cache: npm
          cache-dependency-path: scripts/openapi/package-lock.json
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.0'
          cache: false
      - name: Install OpenAPI checks
        run: npm --prefix scripts/openapi ci --ignore-scripts --no-audit --no-fund
      - name: Validate contract, examples and SRS operation map
        run: npm --prefix scripts/openapi run verify
      - name: Generate and compile Go and TypeScript contracts
        run: npm --prefix scripts/openapi run generators
      - name: Build API documentation
        run: npm --prefix scripts/openapi run docs

  backend:
    name: backend
    needs: detect
    if: github.event_name == 'workflow_dispatch' || needs.detect.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    env:
      CGO_ENABLED: '1'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          working-directory: backend
          args: --timeout=5m
      - name: Check formatting
        run: golangci-lint fmt --diff
      - name: Check generated code
        run: |
          go generate ./...
          git diff --exit-code
          untracked=$(git ls-files --others --exclude-standard)
          if [ -n "$untracked" ]; then
            printf 'Generation produced untracked files:\n%s\n' "$untracked"
            exit 1
          fi
      - name: Vet backend
        run: go vet ./...
      - name: Test backend with PostgreSQL 18 and SeaweedFS
        run: go test -race ./...
      - name: Check vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - name: Build craftpulse-server image
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: docker build --build-arg COMMIT_SHA="$COMMIT_SHA" -t "craftpulse-server:$COMMIT_SHA" -f Dockerfile .

  ci:
    name: ci
    needs: [detect, repository-check, backend]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check required job results
        env:
          DETECT: ${{ needs.detect.result }}
          REPOSITORY: ${{ needs.repository-check.result }}
          BACKEND: ${{ needs.backend.result }}
          BACKEND_CHANGED: ${{ needs.detect.outputs.backend }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          [ "$DETECT" = success ] || { echo "detect: $DETECT"; exit 1; }
          [ "$REPOSITORY" = success ] || { echo "repository-check: $REPOSITORY"; exit 1; }
          case "$BACKEND" in
            success) ;;
            skipped)
              [ "$BACKEND_CHANGED" = false ] && [ "$EVENT_NAME" != workflow_dispatch ] || exit 1
              ;;
            *) echo "backend: $BACKEND"; exit 1 ;;
          esac
