name: Periodic code review

on:
  issues:
    types: [closed, reopened]
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: periodic-code-review
  cancel-in-progress: false

jobs:
  create-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - name: Require project token
        env:
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        run: |
          if [ -z "$PROJECT_TOKEN" ]; then
            echo 'PROJECT_TOKEN is required to read Story points from the craftPulse project.' >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Create review when completed work reaches the threshold
        env:
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/github_periodic_review.py --apply
