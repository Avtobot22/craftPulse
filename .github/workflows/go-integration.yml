name: Go integration tests

on:
  workflow_call:
    inputs:
      matrix:
        required: true
        type: string
      profile:
        default: ''
        type: string
      artifacts:
        default: ''
        type: string
      save-cache:
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  integration:
    name: ${{ matrix.count }} shard(s), index ${{ matrix.index }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.matrix) }}
    env:
      CGO_ENABLED: '1'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/go-cache
        id: go-cache
        with:
          module: backend
          mode: race-integration
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: inputs.profile != ''
        with:
          name: ${{ inputs.profile }}
          path: ${{ runner.temp }}/baseline
      - name: Run the integration shard
        working-directory: backend
        env:
          SHARD_COUNT: ${{ matrix.count }}
          SHARD_INDEX: ${{ matrix.index }}
          PROFILE_ARTIFACT: ${{ inputs.profile }}
          TIMINGS: ${{ runner.temp }}/shard.json
        run: |
          profile=()
          if [[ -n "$PROFILE_ARTIFACT" ]]; then
            profile=(--profile "$RUNNER_TEMP/baseline/shard.json")
          elif [[ -f ../scripts/ci-integration-timings.json ]]; then
            profile=(--profile ../scripts/ci-integration-timings.json)
          fi
          python3 ../scripts/ci_shards.py run --count "$SHARD_COUNT" --index "$SHARD_INDEX" \
            --output "$TIMINGS" "${profile[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.artifacts != ''
        with:
          name: ${{ inputs.artifacts }}-${{ matrix.count }}-${{ matrix.index }}
          path: ${{ runner.temp }}/shard.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: matrix.index == 0 && inputs.save-cache && steps.go-cache.outputs.hit != 'true'
        continue-on-error: true
        with:
          path: ${{ steps.go-cache.outputs.path }}
          key: ${{ steps.go-cache.outputs.key }}
