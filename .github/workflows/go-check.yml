name: Go module

on:
  workflow_call:
    inputs:
      module:
        required: true
        type: string
      check-generated:
        default: false
        type: boolean
      split-test-package:
        default: ''
        type: string
      build:
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ inputs.module }}
    env:
      CGO_ENABLED: '1'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ inputs.module }}/go.mod
          cache: false
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          working-directory: ${{ inputs.module }}
          args: --timeout=5m
      - name: Check formatting
        run: golangci-lint fmt --diff
      - name: Check generated code
        if: inputs.check-generated
        run: |
          go generate ./...
          git diff --exit-code
          untracked=$(git ls-files --others --exclude-standard)
          if [ -n "$untracked" ]; then
            printf 'Generation produced untracked files:\n%s\n' "$untracked"
            exit 1
          fi
      - name: Check vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - name: Build module
        if: inputs.build
        run: go build ./...

  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.split-test-package != '' && '["first-half", "second-half", "other-packages"]' || '["all"]') }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.module }}
    env:
      CGO_ENABLED: '1'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ inputs.module }}/go.mod
          cache-dependency-path: |
            ${{ inputs.module }}/go.mod
            ${{ inputs.module }}/go.sum
      - name: Vet and test module with the race detector
        if: matrix.shard == 'all'
        run: go test -race -vet=all ./...
      - name: Vet and test the first half of the integration package
        if: matrix.shard == 'first-half'
        env:
          PACKAGE: ${{ inputs.split-test-package }}
        run: go test -race -vet=all -run '^Test[A-M]' "$PACKAGE"
      - name: Test the remaining cases in the integration package
        if: matrix.shard == 'second-half'
        env:
          PACKAGE: ${{ inputs.split-test-package }}
        run: go test -race -vet=off -skip '^Test[A-M]' "$PACKAGE"
      - name: Vet and test all other packages
        if: matrix.shard == 'other-packages'
        env:
          PACKAGE: ${{ inputs.split-test-package }}
        run: |
          integration=$(go list "$PACKAGE")
          packages=$(go list ./...)
          targets=()
          while IFS= read -r package; do
            if [[ "$package" != "$integration" ]]; then
              targets+=("$package")
            fi
          done <<< "$packages"
          if (( ${#targets[@]} )); then
            go test -race -vet=all "${targets[@]}"
          fi
