name: Go module

on:
  workflow_call:
    inputs:
      module:
        required: true
        type: string
      check-generated:
        default: false
        type: boolean
      exclude-test-package:
        default: ''
        type: string
      build:
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ inputs.module }}
    env:
      CGO_ENABLED: '1'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/go-cache
        id: go-cache
        with:
          module: ${{ inputs.module }}
          mode: build
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          working-directory: ${{ inputs.module }}
          args: --timeout=5m
          skip-save-cache: ${{ github.ref != 'refs/heads/main' && github.event_name != 'workflow_dispatch' }}
      - name: Check formatting
        run: golangci-lint fmt --diff
      - name: Check generated code
        if: inputs.check-generated
        run: |
          go generate ./...
          git diff --exit-code
          untracked=$(git ls-files --others --exclude-standard)
          if [ -n "$untracked" ]; then
            printf 'Generation produced untracked files:\n%s\n' "$untracked"
            exit 1
          fi
      - name: Check vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - name: Build module
        if: inputs.build
        run: go build ./...

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') && steps.go-cache.outputs.hit != 'true'
        continue-on-error: true
        with:
          path: ${{ steps.go-cache.outputs.path }}
          key: ${{ steps.go-cache.outputs.key }}

  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.module }}
    env:
      CGO_ENABLED: '1'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/go-cache
        id: go-cache
        with:
          module: ${{ inputs.module }}
          mode: race
      - name: Vet and test the whole module
        if: inputs.exclude-test-package == ''
        run: go test -race -vet=all ./...
      - name: Vet and test packages outside the integration suite
        if: inputs.exclude-test-package != ''
        env:
          PACKAGE: ${{ inputs.exclude-test-package }}
        run: |
          integration=$(go list "$PACKAGE")
          packages=$(go list ./...)
          targets=()
          while IFS= read -r package; do
            if [[ "$package" != "$integration" ]]; then
              targets+=("$package")
            fi
          done <<< "$packages"
          if (( ${#targets[@]} )); then
            go test -race -vet=all "${targets[@]}"
          fi

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') && steps.go-cache.outputs.hit != 'true'
        continue-on-error: true
        with:
          path: ${{ steps.go-cache.outputs.path }}
          key: ${{ steps.go-cache.outputs.key }}
