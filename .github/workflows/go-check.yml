name: Go module

on:
  workflow_call:
    inputs:
      module:
        required: true
        type: string
      cache:
        default: false
        type: boolean
      check-generated:
        default: false
        type: boolean
      image:
        default: ''
        type: string

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ inputs.module }}
    env:
      CGO_ENABLED: '1'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ inputs.module }}/go.mod
          cache: ${{ inputs.cache }}
          cache-dependency-path: ${{ inputs.module }}/go.sum
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          working-directory: ${{ inputs.module }}
          args: --timeout=5m
      - name: Check formatting
        run: golangci-lint fmt --diff
      - name: Check generated code
        if: inputs.check-generated
        run: |
          go generate ./...
          git diff --exit-code
          untracked=$(git ls-files --others --exclude-standard)
          if [ -n "$untracked" ]; then
            printf 'Generation produced untracked files:\n%s\n' "$untracked"
            exit 1
          fi
      - name: Vet module
        run: go vet ./...
      - name: Test module
        run: go test -race ./...
      - name: Check vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - name: Build module
        if: inputs.image == ''
        run: go build ./...
      - name: Build image
        if: inputs.image != ''
        env:
          COMMIT_SHA: ${{ github.sha }}
          IMAGE_NAME: ${{ inputs.image }}
        run: docker build --build-arg COMMIT_SHA="$COMMIT_SHA" -t "$IMAGE_NAME:$COMMIT_SHA" -f Dockerfile .
