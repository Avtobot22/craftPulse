name: BuildKit cache
description: Restore per-image layers and enable cache writes for main or manual runs.
runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
    - shell: bash
      run: |
        echo 'CRAFTPULSE_BUILDKIT_CACHE=gha' >> "$GITHUB_ENV"
        if [[ "$GITHUB_REF" == refs/heads/main || "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
          echo 'CRAFTPULSE_BUILDKIT_CACHE_WRITE=1' >> "$GITHUB_ENV"
        fi
