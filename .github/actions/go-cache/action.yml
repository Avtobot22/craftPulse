name: Go toolchain and cache
description: Restore module downloads and a build cache for one workload.
inputs:
  module:
    description: Module directory or tools directory for the cache key.
    required: true
  mode:
    description: Build cache partition.
    required: true
  go-version:
    description: Explicit toolchain version for checks outside a Go module.
    default: ''
outputs:
  key:
    description: Primary cache key.
    value: ${{ steps.key.outputs.key }}
  path:
    description: Cache paths.
    value: ${{ steps.paths.outputs.path }}
  hit:
    description: Whether the primary key was restored.
    value: ${{ steps.cache.outputs.cache-hit }}
runs:
  using: composite
  steps:
    - id: go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ inputs.go-version }}
        go-version-file: ${{ inputs.go-version == '' && format('{0}/go.mod', inputs.module) || '' }}
        cache: false
    - name: Set Go cache paths
      id: paths
      shell: bash
      env:
        CACHE_MODE: ${{ inputs.mode }}
      run: |
        build_cache="$(go env GOCACHE)/$CACHE_MODE"
        echo "GOCACHE=$build_cache" >> "$GITHUB_ENV"
        {
          echo 'path<<EOF'
          go env GOMODCACHE
          echo "$build_cache"
          echo EOF
        } >> "$GITHUB_OUTPUT"
    - name: Set Go cache key
      id: key
      shell: bash
      env:
        PREFIX: go-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ inputs.module }}-${{ inputs.mode }}-
        LOCK: ${{ hashFiles(format('{0}/go.mod', inputs.module), format('{0}/go.sum', inputs.module), format('{0}/package-lock.json', inputs.module), format('{0}/check-generators.sh', inputs.module)) }}
      run: |
        echo "prefix=$PREFIX$LOCK-" >> "$GITHUB_OUTPUT"
        echo "key=$PREFIX$LOCK-$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
    - name: Restore Go cache
      id: cache
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ${{ steps.paths.outputs.path }}
        key: ${{ steps.key.outputs.key }}
        restore-keys: ${{ steps.key.outputs.prefix }}
