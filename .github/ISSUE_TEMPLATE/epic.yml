name: Эпик
description: Крупный результат, который нужно разделить на задачи
labels: ["type:epic"]
body:
  - type: textarea
    id: outcome
    attributes:
      label: Результат
      description: Какую возможность получит пользователь или команда?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Границы и ограничения
      description: Входящие сценарии, исключения и существенные ограничения.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Приёмка эпика
      description: Как проверить результат целиком после завершения дочерних задач?
    validations:
      required: true
  - type: textarea
    id: business-value
    attributes:
      label: Бизнес-ценность и очерёдность
      description: Почему результат нужен раньше или позже других эпиков? Укажи влияние на продукт и поставку; бизнес-приоритет согласует ответственный за продукт вместе с командой.
    validations:
      required: true
  - type: markdown
    attributes:
      value: "После создания заполни в Projects поле Бизнес-приоритет: Высокий, Обычный или Низкий. Story points у эпика оставь пустым; SP оцениваются у дочерних задач. Поле Projects не заполняется из текста Issue автоматически. Добавь реальные задачи через Create sub-issue или Add existing issue, зависимости - через Relationships. Эпик закрывается после приёмки результата целиком."
