          type: object
          required: [state, passed, failed, error, skipped]
          properties:
            state: {$ref: '#/components/schemas/DataState'}
            passed: {type: [integer, 'null']}
            failed: {type: [integer, 'null']}
            error: {type: [integer, 'null']}
            skipped: {type: [integer, 'null']}
        source_url: {type: [string, 'null'], format: uri}
    Attempt:
