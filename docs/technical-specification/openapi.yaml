      required: [runner_class, unit, amount, currency, valid_from, valid_to]
      properties:
        runner_class: {type: string, maxLength: 100}
        unit: {type: string, enum: [minute, hour, period], description: '`period` - фиксированный платёж за тарифный период.'}
        amount: {type: string, pattern: '^[0-9]{1,14}(\.[0-9]{1,4})?$'}
        currency: {type: string, pattern: '^[A-Z]{3}$'}
        valid_from: {type: string, format: date-time}
