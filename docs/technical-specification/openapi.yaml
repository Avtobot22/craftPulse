          headers:
            Location: {$ref: '#/components/headers/Location'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConnectionProbe'}
              example: {"id":"0193a5b0-5757-7000-8000-000000000001","status":"pending","started_at":"2026-11-08T10:01:00Z","finished_at":null,"edition":null,"source_version":null,"contract_version":null,"capabilities":[],"reason_code":null,"retry_after_seconds":3,"configuration_version":1}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        "409":
          $ref: "#/components/responses/Conflict"
