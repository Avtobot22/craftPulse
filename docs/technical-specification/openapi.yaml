      x-craftpulse-action: ingest.upload
      x-craftpulse-delivery: M0
      x-craftpulse-trace: [FR-035, UC-25, UI-51]
      responses:
        '200':
          description: Профиль проверок.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CiCheckProfile'}
              example:
                project_id: 0193a5b0-4444-7000-8000-000000000001
                profile_version_no: 3
                entries:
                  - {component_id: 0193a5b0-7777-7000-8000-000000000001, path_prefix: services/billing, language: go, analysis_kind: code, mode: builtin, profile_id: go-default, image_digest: 'sha256:6b2f0c1d9e8a7b6c5d4e3f2a1b0c9d8e7f6a5b4c3d2e1f0a9b8c7d6e5f4a3b2c'}
                  - {component_id: 0193a5b0-7777-7000-8000-000000000001, path_prefix: services/billing, language: '', analysis_kind: secrets, mode: builtin, profile_id: gitleaks-default, image_digest: 'sha256:1a2b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5d6e7f809'}
                expected_reports: [code, secrets, sca, junit, coverage]
                documentation_roots:
                  - {root_id: 0193a5b0-e4e4-7000-8000-000000000001, kind: docs, path_prefix: docs}
                limits: {max_package_bytes: 26214400, max_unpacked_bytes: 104857600, max_files: 1000}
