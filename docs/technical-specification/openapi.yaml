        rule_id: {type: string}
        state: {$ref: '#/components/schemas/FindingState'}
        severity: {$ref: '#/components/schemas/Severity'}
        confidence: {type: [string, 'null']}
        location: {$ref: '#/components/schemas/CodeLocation'}
        package:
