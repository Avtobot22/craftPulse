        failure_kind: {type: [string, 'null'], description: '`null` - причина неизвестна и коду не приписывается.'}
        runner_class: {type: [string, 'null']}
        started_at: {type: [string, 'null'], format: date-time}
        finished_at: {type: [string, 'null'], format: date-time}
        duration_seconds: {type: [integer, 'null'], minimum: 0}
        source_url: {type: [string, 'null'], format: uri}
    AttemptPage:
      type: object
      required: [data, next_cursor, usage_seconds]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/Attempt'}}
        next_cursor: {type: [string, 'null']}
        usage_seconds: {$ref: '#/components/schemas/MetricValue'}
    TestExecution:
      type: object
      required: [test_case, attempt_id, config_fingerprint, outcome, duration_ms]
      properties:
        test_case:
          type: object
          required: [id, key]
          properties:
            id: {type: string, format: uuid}
            key: {type: string}
        attempt_id: {type: [string, 'null'], format: uuid}
        config_fingerprint: {type: string, pattern: '^[0-9a-f]{64}$'}
        outcome: {type: string, enum: [passed, failed, error, skipped]}
        duration_ms: {type: [integer, 'null'], minimum: 0}
    TestExecutionPage:
      type: object
      required: [data, next_cursor]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/TestExecution'}}
        next_cursor: {type: [string, 'null']}
