              example:
                id: 0193a5b0-5555-7000-8000-000000000001
                name: Jira основной
                provider: jira_dc
                instance: {id: 0193a5b0-aaaa-7000-8000-000000000001, base_url: 'https://jira.example', edition: data_center, source_version: 9.12.15}
                status: active
                adapter_kind: builtin
                access_mode: service_account
                credentials_set_at: '2026-11-08T10:00:00Z'
                sync_paused: false
                paused_until: null
                last_success_at: null
                scopes: [{id: 0193a5b0-5656-7000-8000-000000000001, kind: tracker_project, native_scope_id: '10200', display_name: CORE, area_id: 0193a5b0-8888-7000-8000-000000000002, history_from: '2026-01-01T00:00:00Z'}]
                capabilities: [{capability: read_current, state: verified, reason_code: null, checked_at: '2026-11-08T10:01:14Z'}]
