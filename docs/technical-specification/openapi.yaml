                  - {capability: read_status_history, state: verified, reason_code: null, checked_at: '2026-11-08T10:01:14Z'}
                  - {capability: write_tracker_issue, state: missing, reason_code: permission_missing, checked_at: '2026-11-08T10:01:14Z'}
