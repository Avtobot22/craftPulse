      summary: Подтвердить версию DoD
      description: |
        Обязательство без способа подтверждения не объявляется машинно проверенным (FR-063). Правила версии как у `createMappingVersion`.
        Если содержимое равно действующей версии, возвращается 200 без создания версии.
