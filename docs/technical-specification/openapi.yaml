                      rate_version_no: 1
                    basis_revision_id: 0193a5b0-a1a1-7000-8000-000000000043
                    point_start: 2026-10-01T00:00:00Z
                fixed_fees: [ { amount: '5.0000', currency: RUB } ]
                invoices: [ { invoice_ref: INV-2026-10, amount: '30.0000', currency: RUB } ]
                revision_id: 0193a5b0-a1a1-7000-8000-000000000042
                access_limited: false
                access_notes: []
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /ci-rates:
    get:
      operationId: listCiRates
      summary: Версии ставок стоимости CI
      description: Ставки по классу runner с периодом действия (DR-017).
      tags: [m2]
      x-craftpulse-action: ci_rates.manage
      x-craftpulse-delivery: M2
      x-craftpulse-trace: [FR-056, UC-46, UI-42]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Страница ставок.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CiRatePage'}
              example:
                data: [{version_no: 1, runner_class: linux-medium, unit: minute, amount: '2.0000', currency: RUB, valid_from: '2026-01-01T00:00:00Z', valid_to: null}]
                next_cursor: null
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      operationId: createCiRateVersion
      summary: Задать версию ставки
      description: Новая ставка не переписывает прежние оценки. Перекрытие периодов одного класса и валюты - `422` (ограничение `EXCLUDE`).
      tags: [m2]
      x-craftpulse-action: ci_rates.manage
      x-craftpulse-delivery: M2
      x-craftpulse-trace: [FR-056, FR-007, UC-46, UI-42, UI-17]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CiRateInput'}
            example: {runner_class: linux-medium, unit: minute, amount: '2.5000', currency: RUB, valid_from: '2027-01-01T00:00:00Z', valid_to: null}
      responses:
        '201':
          description: Ставка сохранена.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CiRate'}
              example: {version_no: 2, runner_class: linux-medium, unit: minute, amount: '2.5000', currency: RUB, valid_from: '2027-01-01T00:00:00Z', valid_to: null}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /teams/{team_id}/transfers:
    get:
      operationId: listTeamTransfers
      summary: Межкомандные передачи и ожидания
      description: Подтверждённые эпизоды смены команды-владельца и ожидание после передачи (FR-058, UI-43). Недоступная команда не раскрывает объекты и скрытые итоги; длительность не приписывается виновнику.
      tags: [m2]
      x-craftpulse-action: report.read
      x-craftpulse-delivery: M2
      x-craftpulse-trace: [FR-058, UC-48, UI-43]
      parameters:
        - $ref: '#/components/parameters/TeamId'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Страница эпизодов.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TransferPage'}
              example:
                data: [{task: {kind: task, id: 0193a5b0-f000-7000-8000-000000000050, display_key: CORE-60, title: Миграция платежей, source_url: 'https://jira.example/browse/CORE-60'}, from_team_id: 0193a5b0-3333-7000-8000-000000000001, to_team_id: 0193a5b0-3333-7000-8000-000000000002, effective_at: '2026-10-11T00:00:00Z', wait_seconds: 172800}]
                history_from: '2026-01-01T00:00:00Z'
                next_cursor: null
                access_limited: false
                access_notes: []
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /ci-invoices:
    post:
      operationId: createCiInvoice
      summary: Записать фактический счёт поставщика CI
      description: Счёт хранится отдельно от расчётной оценки и её не перезаписывает (FR-056 A2).
      tags: [m2]
      x-craftpulse-action: ci_rates.manage
      x-craftpulse-delivery: M2
      x-craftpulse-trace: [FR-056, FR-007, UC-46, UI-42]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CiInvoiceInput'}
            example: {invoice_ref: INV-2026-10, period_from: '2026-10-01T00:00:00Z', period_to: '2026-11-01T00:00:00Z', amount: '30.0000', currency: RUB}
      responses:
        '201':
          description: Счёт сохранён.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CiInvoice'}
              example: {id: 0193a5b0-f8f8-7000-8000-000000000001, invoice_ref: INV-2026-10, period_from: '2026-10-01T00:00:00Z', period_to: '2026-11-01T00:00:00Z', amount: '30.0000', currency: RUB}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /operations/{operation_id}:
    get:
      operationId: getBackgroundOperation
      summary: Получить состояние фоновой операции
      description: "Доступна только инициатору в той же организации, с повторной проверкой исходного действия и области: connections.manage для sync_run, report.read для series_refresh, docs.manage для documentation_check. Чужая или истёкшая операция и отзыв доступа к исходному ресурсу дают одинаковый 404. Состояние и безопасная ошибка сохраняются 24 часа после завершения; очистка задания River не удаляет дескриптор раньше этого срока. Внутренние ID и сообщения очереди не выдаются."
      tags:
        - session
      x-craftpulse-action: session.read
      x-craftpulse-delivery: M0
      x-craftpulse-trace:
        - FR-001
        - FR-006
        - FR-023
        - FR-047
        - UC-05
        - UC-10
        - UC-13
        - UC-37
      parameters:
        - name: operation_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Текущее состояние именно запрошенного запуска.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackgroundOperation"
              examples:
                queued:
                  value:
                    id: 0193a5b0-a0a0-7000-8000-000000000001
                    kind: series_refresh
                    status: queued
                    created_at: 2026-11-08T12:00:00Z
                    updated_at: 2026-11-08T12:00:00Z
                    result_uri: null
                    error: null
                    retry_after_seconds: 3
                succeeded:
                  value:
                    id: 0193a5b0-a0a0-7000-8000-000000000001
                    kind: series_refresh
                    status: succeeded
                    created_at: 2026-11-08T12:00:00Z
                    updated_at: 2026-11-08T12:00:10Z
                    result_uri: /api/v1/revisions/0193a5b0-cccc-7000-8000-000000000003
                    error: null
                    retry_after_seconds: null
                failed:
                  value:
                    id: 0193a5b0-a0a0-7000-8000-000000000001
                    kind: series_refresh
                    status: failed
                    created_at: 2026-11-08T12:00:00Z
                    updated_at: 2026-11-08T12:00:10Z
                    result_uri: null
                    error:
                      code: source_unavailable
                      correlation_id: 0193a5b0-7c2e-7d41-8a10-5e2f0c9d4b11
                    retry_after_seconds: null
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    cookieSession:
      type: apiKey
      in: cookie
      name: __Host-cp_session
      description: |
        Сессия браузера (раздел 13.2): случайный идентификатор 32 байта, атрибуты `Secure`,
        `HttpOnly`, `SameSite=Lax`, `Path=/`. Неактивность 1 ч, общий срок 12 ч. Изменяющий
        запрос с этой cookie требует `Origin`, равного адресу сайта.
    apiKey:
      type: http
      scheme: bearer
      bearerFormat: cpk_
      description: |
        Ключ API для внешней BI-системы (раздел 13.3): `Authorization: Bearer cpk_...`.
        Только чтение показателей и выгрузка в правах владельца на момент запроса. Ключ в
        адресе запроса отклоняется и отзывается.
    uploadToken:
      type: http
      scheme: bearer
      bearerFormat: cpt_
      description: |
        Токен загрузки CI проекта (раздел 13.3): `Authorization: Bearer cpt_...`. Разрешает
        только загрузку пакета, чтение его квитанции и профиля проверок своего проекта.
    surveyInvite:
      type: http
      scheme: bearer
      bearerFormat: cps_
      description: |
        Приглашение участника pulse-опроса (M2, UC-44). Правила выдачи, срок и аудитория
        задаются решением Q-02; до него операции опроса не включаются.
  parameters:
    Limit:
      name: limit
      in: query
      description: Размер страницы.
      schema: {type: integer, minimum: 1, maximum: 200, default: 50}
    Cursor:
      name: cursor
      in: query
      description: Непрозрачный курсор из `next_cursor` предыдущей страницы. Содержимое курсора не разбирается клиентом; курсор действует 24 ч.
      schema: {type: string, minLength: 1, maxLength: 512}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID одной попытки подтверждения. Повтор с тем же ключом возвращает сохранённый результат.
      schema: {type: string, format: uuid}
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Значение `ETag` прочитанной версии ресурса.
      schema: {type: string, minLength: 1, maxLength: 64}
    From:
      name: from
      in: query
      required: true
      description: Начало периода включительно, RFC 3339.
      schema: {type: string, format: date-time}
    To:
      name: to
      in: query
      required: true
      description: Конец периода исключительно, RFC 3339 (BR-006).
      schema: {type: string, format: date-time}
    AsOf:
      name: as_of
      in: query
      description: Дата состояния расчёта. По умолчанию - конец периода или текущий момент.
      schema: {type: string, format: date-time}
    Step:
      name: step
      in: query
      description: Шаг ряда.
      schema: {type: string, enum: [day, week, month], default: week}
    RevisionQuery:
      name: revision_id
      in: query
      description: Конкретная ревизия расчёта. Без параметра выдаётся актуальная ревизия ряда (FR-009).
      schema: {type: string, format: uuid}
    TeamId: {name: team_id, in: path, required: true, schema: {type: string, format: uuid}}
    ProjectId: {name: project_id, in: path, required: true, schema: {type: string, format: uuid}}
    ServiceId: {name: service_id, in: path, required: true, schema: {type: string, format: uuid}}
    ComponentId: {name: component_id, in: path, required: true, schema: {type: string, format: uuid}}
    UserId: {name: user_id, in: path, required: true, schema: {type: string, format: uuid}}
    ApiKeyId: {name: api_key_id, in: path, required: true, schema: {type: string, format: uuid}}
    UploadTokenId: {name: upload_token_id, in: path, required: true, schema: {type: string, format: uuid}}
    ConnectionId: {name: connection_id, in: path, required: true, schema: {type: string, format: uuid}}
    ProbeId: {name: probe_id, in: path, required: true, schema: {type: string, format: uuid}}
    ReceiptId: {name: receipt_id, in: path, required: true, schema: {type: string, format: uuid}}
    ConflictId: {name: conflict_id, in: path, required: true, schema: {type: string, format: uuid}}
    SeriesId: {name: series_id, in: path, required: true, schema: {type: string, format: uuid}}
    RevisionId: {name: revision_id, in: path, required: true, schema: {type: string, format: uuid}}
    SavedViewId: {name: saved_view_id, in: path, required: true, schema: {type: string, format: uuid}}
    ExportId: {name: export_id, in: path, required: true, schema: {type: string, format: uuid}}
    TaskId: {name: task_id, in: path, required: true, schema: {type: string, format: uuid}}
    LinkId: {name: link_id, in: path, required: true, schema: {type: string, format: uuid}}
    MergeRequestId: {name: merge_request_id, in: path, required: true, schema: {type: string, format: uuid}}
    PipelineId: {name: pipeline_id, in: path, required: true, schema: {type: string, format: uuid}}
    FindingId: {name: finding_id, in: path, required: true, schema: {type: string, format: uuid}}
    ExceptionId: {name: exception_id, in: path, required: true, schema: {type: string, format: uuid}}
    DocumentId: {name: document_id, in: path, required: true, schema: {type: string, format: uuid}}
  headers:
    ETag:
      description: Версия ресурса для `If-Match`.
      schema: {type: string}
    Location:
      description: Адрес созданного ресурса или ресурса-операции.
      schema: {type: string, format: uri-reference}
    RetryAfter:
      description: Через сколько секунд повторить запрос.
      schema: {type: integer, minimum: 1}
  responses:
    BadRequest:
      description: Запрос не разобран или содержит неизвестный параметр.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          example:
            type: 'urn:craftpulse:problem:unknown_parameter'
            title: Unknown query parameter
            status: 400
            code: unknown_parameter
            detail: 'Parameter "sorting" is not supported; supported: sort, limit, cursor'
            correlation_id: 0193a5b0-7c2e-7d41-8a10-5e2f0c9d4b11
    Unauthorized:
      description: Нет действующей сессии, ключа или токена. Данных в ответе нет.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          example:
            type: 'urn:craftpulse:problem:auth_required'
            title: Authentication required
            status: 401
            code: auth_required
            correlation_id: 0193a5b0-7c2e-7d41-8a10-5e2f0c9d4b12
    Forbidden:
      description: |
        Субъект видит область, но его роль не содержит действия (`forbidden`), или изменяющий
        запрос пришёл с чужим `Origin` (`origin_rejected`). Если область субъекту не видна,
        ответ - `404 not_found`.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          example:
            type: 'urn:craftpulse:problem:forbidden'
            title: Action is not allowed
            status: 403
            code: forbidden
            correlation_id: 0193a5b0-7c2e-7d41-8a10-5e2f0c9d4b13
    NotFound:
      description: Объект не существует, принадлежит другой организации или закрыт для субъекта. Ответ одинаков во всех трёх случаях.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          example:
            type: 'urn:craftpulse:problem:not_found'
            title: Not found
            status: 404
            code: not_found
            correlation_id: 0193a5b0-7c2e-7d41-8a10-5e2f0c9d4b14
    Conflict:
      description: |
        Операция невозможна в текущем состоянии ресурса (`state_conflict`), у подключения нет
        нужной проверенной возможности (`capability_missing`) или сводка MR относится к
        устаревшему head (`stale_head`). Повтор того же запроса не поможет.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          example:
            type: 'urn:craftpulse:problem:capability_missing'
            title: Connection capability is missing
            status: 409
            code: capability_missing
            detail: Connection has no verified capability write_tracker_issue
            correlation_id: 0193a5b0-7c2e-7d41-8a10-5e2f0c9d4b15
    PreconditionFailed:
      description: Версия в `If-Match` устарела. Перечитайте ресурс, покажите пользователю актуальную версию и повторите (FR-008).
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          example:
            type: 'urn:craftpulse:problem:version_conflict'
            title: Resource version has changed
            status: 412
            code: version_conflict
            correlation_id: 0193a5b0-7c2e-7d41-8a10-5e2f0c9d4b16
    PreconditionRequired:
      description: Для изменения версионируемого ресурса нужен заголовок `If-Match`.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          example:
            type: 'urn:craftpulse:problem:precondition_required'
            title: If-Match header is required
            status: 428
            code: precondition_required
            correlation_id: 0193a5b0-7c2e-7d41-8a10-5e2f0c9d4b17
    ContentTooLarge:
      description: Тело больше предела операции (NFR-015).
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          example:
            type: 'urn:craftpulse:problem:payload_too_large'
            title: Payload is too large
            status: 413
            code: payload_too_large
            detail: Package exceeds 26214400 bytes
            correlation_id: 0193a5b0-7c2e-7d41-8a10-5e2f0c9d4b18
    UnsupportedMediaType:
      description: Неподдержанный `Content-Type` тела.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          example:
            type: 'urn:craftpulse:problem:unsupported_media_type'
            title: Unsupported media type
            status: 415
            code: unsupported_media_type
            correlation_id: 0193a5b0-7c2e-7d41-8a10-5e2f0c9d4b19
    ValidationFailed:
      description: |
        Данные разобраны, но не проходят по смыслу. Все ошибки полей возвращаются одним
        ответом (`validation_failed`). Тот же `Idempotency-Key` с другим телом -
        `idempotency_key_reused`.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          example:
            type: 'urn:craftpulse:problem:validation_failed'
            title: Validation failed
            status: 422
            code: validation_failed
            correlation_id: 0193a5b0-7c2e-7d41-8a10-5e2f0c9d4b1a
            errors:
              - {field: /reason, code: required, detail: Reason must not be empty}
              - {field: /expires_at, code: out_of_range, detail: Must be later than effective_from}
    TooManyRequests:
      description: Превышен лимит частоты на границе (адреса входа, webhook, загрузка пакетов). Повторить через `Retry-After`.
      headers:
        Retry-After: {$ref: '#/components/headers/RetryAfter'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          example:
            type: 'urn:craftpulse:problem:rate_limited'
            title: Too many requests
            status: 429
            code: rate_limited
            correlation_id: 0193a5b0-7c2e-7d41-8a10-5e2f0c9d4b1b
    ServiceUnavailable:
      description: Хранилище объектов или база недоступны; запрос не выполнен. Повторить через `Retry-After` (раздел 10.7).
      headers:
        Retry-After: {$ref: '#/components/headers/RetryAfter'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          example:
            type: 'urn:craftpulse:problem:service_unavailable'
            title: Service temporarily unavailable
            status: 503
            code: service_unavailable
            correlation_id: 0193a5b0-7c2e-7d41-8a10-5e2f0c9d4b1c
  schemas:
    Problem:
      type: object
      description: Ошибка по RFC 9457 с расширениями craftPulse. Стек, SQL, внутренние адреса и значения параметров в ответ не попадают (SEC-23).
      required: [type, title, status, code, correlation_id]
      properties:
        type: {type: string, format: uri, description: '`urn:craftpulse:problem:<code>`.'}
        title: {type: string, description: Краткое название типа ошибки для разработчика.}
        status: {type: integer, minimum: 400, maximum: 599, description: Совпадает с HTTP-кодом ответа.}
        detail: {type: string, description: Пояснение конкретного случая; не показывается пользователю как есть.}
        code:
          type: string
          description: Стабильный код для ветвления клиента. Каталог - раздел 5 ТЗ.
          examples: [not_found]
        correlation_id: {type: string, format: uuid, description: ID для поиска записи в журнале (NFR-018).}
        errors:
          type: array
          description: Ошибки полей для `validation_failed`.
          items: {$ref: '#/components/schemas/FieldError'}
    FieldError:
      type: object
      required: [field, code]
      properties:
        field: {type: string, description: JSON Pointer поля в теле или имя параметра.}
        code:
          type: string
          description: Причина ошибки поля.
          enum: [required, invalid_format, out_of_range, too_long, unknown_field, not_allowed_value, duplicate, outside_scope, unknown_reference]
        detail: {type: string}
    Redactions:
      type: array
      description: "Имена отсутствующих необязательных полей, закрытых правами. Индексы и пути к скрытым элементам коллекции запрещены: элементы отфильтровываются, а ограничение отмечается access_limited/access_notes. Обязательные поля схемы не маскируются отдельно; отсутствие права на такой объект закрывает весь объект."
      items: {"type":"string","pattern":"^[a-z][a-z0-9_]*$"}
    AccessNote:
      type: object
      description: Отметка ограничения выдачи без числа и названий скрытых объектов (FR-001).
      required: [code]
      properties:
        code:
          type: string
          enum: [restricted_by_access, access_check_unavailable, source_access_lost]
          description: |
            `restricted_by_access` - часть объектов закрыта правами; `access_check_unavailable` -
            проверка прав источника недоступна, его область не выдаётся; `source_access_lost` -
            подключение потеряло доступ.
        connection_id: {type: [string, 'null'], format: uuid}
    DataState:
      type: string
      description: Состояние данных показателя по модели метрик (раздел 4.3 ТЗ).
      enum: [ASSESSED, PROVISIONAL, BOUNDED, UNKNOWN, NOT_EVALUATED, NOT_APPLICABLE]
    MetricValue:
      type: object
      description: |
        Значение точки ряда. `value` есть только у `ASSESSED` и `PROVISIONAL`, `bound` - только у
        `BOUNDED`; у остальных состояний значения нет. Процент без известного знаменателя не
        выдаётся (FR-003).
      required: [state, value, unit, numerator, denominator, n, bound, low_sample, excluded_count, missing_count, reason_code]
      properties:
        state: {$ref: '#/components/schemas/DataState'}
        value: {type: [number, 'null']}
        unit: {type: string, examples: [seconds, count, ratio]}
        numerator: {type: [number, 'null']}
        denominator: {type: [number, 'null'], minimum: 0}
        n: {type: [integer, 'null'], minimum: 0}
        bound:
          type: [object, 'null']
          required: [kind, value]
          properties:
            kind: {type: string, enum: [lower, upper]}
            value: {type: number}
        low_sample: {type: boolean, description: 'n < 20: отметка малой выборки, не замена состояния.'}
        excluded_count: {type: integer, minimum: 0}
        missing_count: {type: integer, minimum: 0}
        reason_code: {type: [string, 'null'], description: 'Причина состояния, например `history_incomplete` или `scan_missing`.'}
    Period:
      type: object
      required: [from, to]
      properties:
        from: {type: string, format: date-time}
        to: {type: string, format: date-time}
    ObjectRef:
      type: object
      description: Ссылка на объект craftPulse с данными для показа и адресом в источнике.
      required: [kind, id, display_key, title, source_url]
      properties:
        kind: {type: string, enum: [task, merge_request, pipeline, attempt, finding, document, deployment, artifact, incident, test_case]}
        id: {type: string, format: uuid}
        display_key: {type: [string, 'null'], description: 'Ключ источника для показа, например `CORE-12` или `!42`.'}
        title: {type: [string, 'null']}
        source_url: {type: [string, 'null'], format: uri}
    AreaRef:
      type: object
      description: Область источника - проект трекера, репозиторий, пространство wiki.
      required: [id, kind, display_name, connection_id]
      properties:
        id: {type: string, format: uuid}
        kind: {type: string, enum: [tracker_project, repository, wiki_space, ci_project, analysis_project]}
        display_name: {type: string}
        connection_id: {type: [string, 'null'], format: uuid}
    ActorRef:
      type: object
      required: [account_id, kind, display_name]
      properties:
        account_id: {type: [string, 'null'], format: uuid}
        kind: {type: string, enum: [human, bot, system, unknown]}
        display_name: {type: [string, 'null']}
    ReceiptAccepted:
      type: object
      description: Пакет принят к разбору. Итог - в квитанции по адресу `Location`.
      required: ["receipt_id","status","retry_after_seconds"]
      properties:
        receipt_id: {type: string, format: uuid}
        status: {type: string, enum: [quarantined, duplicate]}
        duplicate_of: {type: [string, 'null'], format: uuid}
        retry_after_seconds:
          type:
            - integer
            - "null"
          minimum: 1
          description: Через сколько секунд прочитать квитанцию по Location; null, если результат уже конечный. Для duplicate опрашивается первая квитанция.
    Team:
      type: object
      required: [id, name, status]
      properties:
        id: {type: string, format: uuid}
        name: {type: string, minLength: 1, maxLength: 200}
        status: {type: string, enum: [active, archived]}
    Project:
      $ref: '#/components/schemas/Team'
    Service:
      $ref: '#/components/schemas/Team'
    TeamPage:
      type: object
      required: [data, next_cursor]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/Team'}}
        next_cursor: {type: [string, 'null']}
    ProjectPage:
      type: object
      required: [data, next_cursor]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/Project'}}
        next_cursor: {type: [string, 'null']}
    ServicePage:
      type: object
      required: [data, next_cursor]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/Service'}}
        next_cursor: {type: [string, 'null']}
    AreaPage:
      type: object
      required: [data, next_cursor]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/AreaRef'}}
        next_cursor: {type: [string, 'null']}
    User:
      type: object
      required: [id, display_name, status, person_id]
      properties:
        id: {type: string, format: uuid}
        display_name: {type: [string, 'null']}
        status: {type: string, enum: [active, blocked]}
        person_id: {type: [string, 'null'], format: uuid}
    UserPage:
      type: object
      required: [data, next_cursor]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/User'}}
        next_cursor: {type: [string, 'null']}
    Role:
      type: string
      description: Роль craftPulse (раздел 2.2, 7.7). `security_access` и `wiki_access` - отдельные права на данные безопасности и wiki.
      enum: [administrator, dev_lead, project_manager, tech_lead, developer, process_owner, service_owner, security_access, wiki_access]
    RoleAssignmentInput:
      type: object
      additionalProperties: false
      description: Область роли - не больше одного из `team_id`, `project_id`, `service_id`; все пустые - вся организация. `administrator` - только вся организация, `process_owner` - команда, `service_owner` - сервис.
      required: [role, team_id, project_id, service_id]
      properties:
        role: {$ref: '#/components/schemas/Role'}
        team_id: {type: [string, 'null'], format: uuid}
        project_id: {type: [string, 'null'], format: uuid}
        service_id: {type: [string, 'null'], format: uuid}
    RoleAssignment:
      type: object
      required: [role, team_id, project_id, service_id, assigned_at]
      properties:
        role: {$ref: '#/components/schemas/Role'}
        team_id: {type: [string, 'null'], format: uuid}
        project_id: {type: [string, 'null'], format: uuid}
        service_id: {type: [string, 'null'], format: uuid}
        assigned_at: {type: string, format: date-time}
    RoleAssignmentList:
      type: object
      required: [data]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/RoleAssignment'}}
    RoleAssignmentListInput:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: {type: array, maxItems: 200, items: {$ref: '#/components/schemas/RoleAssignmentInput'}}
    CurrentUser:
      type: object
      required: [ user, organization, roles, areas, actions, session ]
      properties:
        user: { $ref: '#/components/schemas/User' }
        organization:
          type: object
          required: [ id, name, slug, status ]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            slug: { type: string }
            status: { type: string, enum: [ setup, active, blocked, deleting ] }
        roles: { type: array, items: { $ref: '#/components/schemas/RoleAssignment' } }
        areas:
          type: object
          description: Назначенная область. Пустые списки - область не назначена.
          required: [ teams, projects, services ]
          properties:
            teams: { type: array, items: { $ref: '#/components/schemas/Team' } }
            projects: { type: array, items: { $ref: '#/components/schemas/Project' } }
            services: { type: array, items: { $ref: '#/components/schemas/Service' } }
        actions:
          type: array
          description: Значения `x-craftpulse-action`, разрешённые ролями пользователя хотя бы в одной области. Для показа элементов интерфейса; сервер проверяет право на каждом запросе.
          items: { type: string }
        session:
          type: object
          required: [ expires_at, idle_expires_at ]
          properties:
            expires_at: { type: string, format: date-time, description: Конец общего срока 12 ч. }
            idle_expires_at: { type: string, format: date-time, description: Конец срока неактивности 1 ч на момент ответа. }
        review_participation:
          $ref: "#/components/schemas/ReviewParticipation"
          description: Личное участие в рекомендациях ревью (UI-69). Передаётся с M1 при доступной возможности; отсутствие поля означает, что настройка сейчас недоступна, а не согласие на участие.
    ReviewParticipation:
      type: object
      additionalProperties: false
      required: [participates]
      properties:
        participates: {type: boolean}
    SourceLink:
      type: object
      required: [connection_id, provider, display_name, state, linked_at]
      properties:
        connection_id: {type: string, format: uuid}
        provider: {$ref: '#/components/schemas/Provider'}
        display_name: {type: string}
        state: {type: string, enum: [not_linked, linked, expired, revoked]}
        linked_at: {type: [string, 'null'], format: date-time}
    SourceLinkList:
      type: object
      required: [data]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/SourceLink'}}
    AuthorizationRedirect:
      type: object
      required: [authorization_url]
      properties:
        authorization_url: {type: string, format: uri}
    Interval:
      type: object
      description: Интервал действия `[valid_from, valid_to)`. `null` в `valid_to` - открытый интервал.
      required: [valid_from, valid_to]
      properties:
        valid_from: {type: string, format: date-time}
        valid_to: {type: [string, 'null'], format: date-time}
    Component:
      type: object
      required: [id, service_id, repository_area_id, path_prefix, status, origin]
      properties:
        id: {type: string, format: uuid}
        service_id: {type: string, format: uuid}
        repository_area_id: {type: string, format: uuid}
        path_prefix: {type: string, maxLength: 1024, description: Пусто - весь репозиторий.}
        status: {type: string, enum: [proposed, confirmed, rejected]}
        origin: {type: string, enum: [manifest, manual]}
    ComponentInput:
      type: object
      additionalProperties: false
      required: [id, service_id, repository_area_id, path_prefix, status]
      properties:
        id: {type: [string, 'null'], format: uuid, description: '`null` - новый компонент.'}
        service_id: {type: string, format: uuid}
        repository_area_id: {type: string, format: uuid}
        path_prefix: {type: string, maxLength: 1024}
        status: {type: string, enum: [confirmed, rejected]}
    TeamProjectLink:
      allOf:
        - type: object
          required: [team_id, project_id]
          properties:
            team_id: {type: string, format: uuid}
            project_id: {type: string, format: uuid}
        - $ref: '#/components/schemas/Interval'
    ProjectAreaLink:
      allOf:
        - type: object
          required: [project_id, area_id]
          properties:
            project_id: {type: string, format: uuid}
            area_id: {type: string, format: uuid}
        - $ref: '#/components/schemas/Interval'
    TeamMemberLink:
      allOf:
        - type: object
          required: [team_id, person_id]
          properties:
            team_id: {type: string, format: uuid}
            person_id: {type: string, format: uuid}
        - $ref: '#/components/schemas/Interval'
    NamedEntityInput:
      type: object
      additionalProperties: false
      required: [id, name, status]
      properties:
        id: {type: [string, 'null'], format: uuid, description: '`null` - новая запись.'}
        name: {type: string, minLength: 1, maxLength: 200}
        status: {type: string, enum: [active, archived]}
    OrganizationStructure:
      type: object
      required: [version, teams, projects, services, components, team_projects, project_areas, team_members]
      properties:
        version: {type: integer, minimum: 0}
        teams: {type: array, items: {$ref: '#/components/schemas/Team'}}
        projects: {type: array, items: {$ref: '#/components/schemas/Project'}}
        services: {type: array, items: {$ref: '#/components/schemas/Service'}}
        components: {type: array, items: {$ref: '#/components/schemas/Component'}}
        team_projects: {type: array, items: {$ref: '#/components/schemas/TeamProjectLink'}}
        project_areas: {type: array, items: {$ref: '#/components/schemas/ProjectAreaLink'}}
        team_members: {type: array, items: {$ref: '#/components/schemas/TeamMemberLink'}}
    OrganizationStructureInput:
      type: object
      additionalProperties: false
      required: [teams, projects, services, components, team_projects, project_areas, team_members]
      properties:
        teams: {type: array, maxItems: 500, items: {$ref: '#/components/schemas/NamedEntityInput'}}
        projects: {type: array, maxItems: 2000, items: {$ref: '#/components/schemas/NamedEntityInput'}}
        services: {type: array, maxItems: 2000, items: {$ref: '#/components/schemas/NamedEntityInput'}}
        components: {type: array, maxItems: 5000, items: {$ref: '#/components/schemas/ComponentInput'}}
        team_projects:
          type: array
          maxItems: 5000
          items:
            type: object
            additionalProperties: false
            required: [team_id, project_id, valid_from, valid_to]
            properties:
              team_id: {type: string, format: uuid}
              project_id: {type: string, format: uuid}
              valid_from: {type: [string, 'null'], format: date-time, description: 'На M0 `null`: интервал начинается с момента сохранения.'}
              valid_to: {type: [string, 'null'], format: date-time}
        project_areas:
          type: array
          maxItems: 5000
          items:
            type: object
            additionalProperties: false
            required: [project_id, area_id, valid_from, valid_to]
            properties:
              project_id: {type: string, format: uuid}
              area_id: {type: string, format: uuid}
              valid_from: {type: [string, 'null'], format: date-time, description: 'На M0 `null`: интервал начинается с момента сохранения.'}
              valid_to: {type: [string, 'null'], format: date-time}
        team_members:
          type: array
          maxItems: 5000
          items:
            type: object
            additionalProperties: false
            required: [team_id, person_id, valid_from, valid_to]
            properties:
              team_id: {type: string, format: uuid}
              person_id: {type: string, format: uuid}
              valid_from: {type: [string, 'null'], format: date-time, description: 'На M0 `null`: интервал начинается с момента сохранения.'}
              valid_to: {type: [string, 'null'], format: date-time}
    ActorKind:
      type: string
      enum: [human, bot, system, unknown]
    Person:
      type: object
      required: [id, display_name, kind]
      properties:
        id: {type: string, format: uuid}
        display_name: {type: [string, 'null'], description: '`null` после обезличивания.'}
        kind: {$ref: '#/components/schemas/ActorKind'}
    PersonPage:
      type: object
      required: [data, next_cursor]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/Person'}}
        next_cursor: {type: [string, 'null']}
    Provider:
      type: string
      description: Вид источника. Клиент показывает неизвестное значение как «другой источник».
      enum: [jira_dc, gitlab, github, jenkins, sonarqube, confluence_dc, git, universal, client]
    SourceAccount:
      type: object
      required: [id, instance_id, provider, native_account_id, login, display_name, proposed_kind, assignment, proposals]
      properties:
        id: {type: string, format: uuid}
        instance_id: {type: string, format: uuid}
        provider: {$ref: '#/components/schemas/Provider'}
        native_account_id: {type: string}
        login: {type: [string, 'null']}
        display_name: {type: [string, 'null']}
        proposed_kind: {$ref: '#/components/schemas/ActorKind', description: 'Вид участника по данным источника (признак бота или служебной записи); предложение, действует только подтверждённое `assignment.actor_kind`.'}
        assignment:
          type: [object, 'null']
          required: [id, person_id, actor_kind, confirmed_at]
          properties:
            id: {type: string, format: uuid}
            person_id: {type: [string, 'null'], format: uuid}
            actor_kind: {$ref: '#/components/schemas/ActorKind'}
            confirmed_at: {type: string, format: date-time}
        proposals:
          type: array
          description: Предложения сопоставления; совпадение имени предложения не создаёт.
          items:
            type: object
            required: [person_id, basis]
            properties:
              person_id: {type: string, format: uuid}
              basis: {type: string, enum: [login_match, email_match, provider_identity]}
    SourceAccountPage:
      type: object
      required: [data, next_cursor]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/SourceAccount'}}
        next_cursor: {type: [string, 'null']}
    AccountAssignmentBatch:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: object
            additionalProperties: false
            required: [source_account_id, person_id, actor_kind, base_assignment_id]
            properties:
              source_account_id: {type: string, format: uuid}
              person_id: {type: [string, 'null'], format: uuid, description: 'Обязателен для `human`, если не задан `create_person`.'}
              create_person: {type: boolean, default: false, description: 'Создать нового человека с отображаемым именем учётной записи и привязать её к нему; `person_id` при этом `null`. Так заводится участник, которого ещё нет в `listPersons`.'}
              actor_kind: {$ref: '#/components/schemas/ActorKind'}
              base_assignment_id: {type: [string, 'null'], format: uuid, description: 'Действующая привязка, которую видел администратор; `null` - привязки не было.'}
    AccountAssignmentBatchResult:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [source_account_id, outcome, assignment_id, error_code]
            properties:
              source_account_id: {type: string, format: uuid}
              outcome: {type: string, enum: [saved, unchanged, version_conflict, rejected]}
              assignment_id: {type: [string, 'null'], format: uuid}
              error_code: {type: [string, 'null'], description: 'Для `rejected`: `not_found`, `person_required` и т. п.'}
    ScopeGrant:
      type: object
      additionalProperties: false
      description: Ровно одно из полей задано.
      required: [team_id, project_id, service_id]
      properties:
        team_id: {type: [string, 'null'], format: uuid}
        project_id: {type: [string, 'null'], format: uuid}
        service_id: {type: [string, 'null'], format: uuid}
    ApiKey:
      type: object
      required: [id, owner_user_id, grants, created_at, expires_at, revoked_at]
      properties:
        id: {type: string, format: uuid}
        owner_user_id: {type: string, format: uuid}
        grants: {type: array, items: {$ref: '#/components/schemas/ScopeGrant'}}
        created_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        revoked_at: {type: [string, 'null'], format: date-time}
    ApiKeyCreated:
      allOf:
        - $ref: '#/components/schemas/ApiKey'
        - type: object
          required: [value]
          properties:
            value: {type: string, pattern: '^cpk_[A-Za-z0-9_-]{43}$', description: Значение ключа; показывается один раз.}
    ApiKeyCreate:
      type: object
      additionalProperties: false
      required: [owner_user_id, grants, expires_at]
      properties:
        owner_user_id: {type: string, format: uuid}
        grants: {type: array, minItems: 1, maxItems: 100, items: {$ref: '#/components/schemas/ScopeGrant'}}
        expires_at: {type: string, format: date-time, description: Не позже 365 дней от выпуска.}
    ApiKeyPage:
      type: object
      required: [data, next_cursor]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/ApiKey'}}
        next_cursor: {type: [string, 'null']}
    UploadToken:
      type: object
      required: [id, project_id, slot, created_at, revoked_at]
      properties:
        id: {type: string, format: uuid}
        project_id: {type: string, format: uuid}
        slot: {type: integer, enum: [1, 2]}
        created_at: {type: string, format: date-time}
        revoked_at: {type: [string, 'null'], format: date-time}
    UploadTokenCreated:
      allOf:
        - $ref: '#/components/schemas/UploadToken'
        - type: object
          required: [value]
          properties:
            value: {type: string, pattern: '^cpt_[A-Za-z0-9_-]{43}$', description: Значение токена; показывается один раз.}
    UploadTokenCreate:
      type: object
      additionalProperties: false
      required: [project_id]
      properties:
        project_id: {type: string, format: uuid}
    UploadTokenPage:
      type: object
      required: [data, next_cursor]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/UploadToken'}}
        next_cursor: {type: [string, 'null']}
    InstallationProtocol:
      type: object
      required: [id, release_sha, started_at, finished_at, outcome, checks]
      properties:
        id: {type: string, format: uuid}
        release_sha: {type: string, pattern: '^[0-9a-f]{40}$'}
        started_at: {type: string, format: date-time}
        finished_at: {type: [string, 'null'], format: date-time}
        outcome: {type: string, enum: [running, passed, failed]}
        checks:
          type: array
          items:
            type: object
            required: [check_kind, outcome, reason_code]
            properties:
              check_kind: {type: string, enum: [site, adapter, adapter_store, identity_provider, update_source, database, object_store, runner_network]}
              outcome: {type: string, enum: [passed, failed, skipped]}
              reason_code: {type: [string, 'null']}
    AuditEvent:
      type: object
      required: [id, occurred_at, actor_kind, actor_id, operation, object_kind, object_id, outcome, reason_code, correlation_id]
      properties:
        id: {type: string, format: uuid}
        occurred_at: {type: string, format: date-time}
        actor_kind: {type: string, enum: [user, api_key, upload_token, system, source]}
        actor_id: {type: [string, 'null'], format: uuid}
        operation: {type: string}
        object_kind: {type: [string, 'null']}
        object_id: {type: [string, 'null'], format: uuid}
        outcome: {type: string, enum: [succeeded, denied, failed]}
        reason_code: {type: [string, 'null']}
        correlation_id: {type: string, format: uuid}
    AuditEventPage:
      type: object
      required: [data, next_cursor]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/AuditEvent'}}
        next_cursor: {type: [string, 'null']}
    DataKind:
      type: string
      enum: [tasks, merge_requests, ci, reports, documents, accounts, permissions]
    Adapter:
      type: object
      required: [provider, display_name, editions, contract_versions, data_kinds, scope_kinds, credential_fields]
      properties:
        provider: {$ref: '#/components/schemas/Provider'}
        display_name: {type: string}
        editions: {type: array, items: {type: string}}
        contract_versions: {type: array, items: {type: string}}
        data_kinds: {type: array, items: {$ref: '#/components/schemas/DataKind'}}
        scope_kinds:
          type: array
          description: Виды областей, которые принимает адаптер в `ConnectionScopeInput.kind`.
          items: {type: string, enum: [tracker_project, repository, wiki_space, ci_project, analysis_project]}
        credential_fields:
          type: array
          description: Поля `Credentials` этого адаптера; по ним строится блок «Учётные данные» формы UI-10.
          items:
            type: object
            required: [name, label, required, secret]
            properties:
              name: {type: string, maxLength: 64, description: Ключ в `Credentials`.}
              label: {type: string}
              required: {type: boolean}
              secret: {type: boolean, description: Значение вводится скрытым полем и после сохранения не показывается.}
    AdapterList:
      type: object
      required: [data]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/Adapter'}}
    Capability:
      type: object
      required: [capability, state, reason_code, checked_at]
      properties:
        capability:
          type: string
          enum: [read_current, read_status_history, read_field_history, read_resolution_history, read_sprint_history, read_links, read_permissions, read_deletions, write_mr_comment, write_tracker_issue, webhook]
        state: {type: string, enum: [verified, partial, missing]}
        reason_code: {type: [string, 'null'], description: 'Причина для `partial` и `missing`, например `permission_missing`.'}
        checked_at: {type: string, format: date-time}
    ConnectionScope:
      type: object
      required: [id, kind, native_scope_id, display_name, area_id, history_from]
      properties:
        id: {type: string, format: uuid}
        kind: {type: string, enum: [tracker_project, repository, wiki_space, ci_project, analysis_project]}
        native_scope_id: {type: string, maxLength: 255}
        display_name: {type: string}
        area_id: {type: [string, 'null'], format: uuid, description: Область появляется после первого сбора.}
        repository_scope_id: {type: [string, 'null'], format: uuid}
        history_from: {type: [string, 'null'], format: date-time}
    ConnectionScopeInput:
      type: object
      additionalProperties: false
      required: [kind, native_scope_id, history_from]
      properties:
        kind: {type: string, enum: [tracker_project, repository, wiki_space, ci_project, analysis_project]}
        native_scope_id: {type: string, minLength: 1, maxLength: 255}
        history_from: {type: [string, 'null'], format: date-time, description: Начало загрузки истории; `null` - вся доступная история.}
        repository_scope_id: {type: [string, 'null'], format: uuid, description: 'Для `ci_project` и `analysis_project` вне Git-хостинга (Jenkins, SonarQube) - область репозитория, к которой относятся их запуски и отчёты (раздел 13.5).'}
    Connection:
      type: object
      required: [id, name, provider, instance, status, adapter_kind, access_mode, credentials_set_at, sync_paused, paused_until, last_success_at, scopes, capabilities]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        provider: {$ref: '#/components/schemas/Provider'}
        instance:
          type: object
          required: [id, base_url, edition, source_version]
          properties:
            id: {type: string, format: uuid}
            base_url: {type: [string, 'null'], format: uri}
            edition: {type: [string, 'null']}
            source_version: {type: [string, 'null']}
        status:
          type: string
          enum: [draft, active, access_lost, deleted]
          description: Из `access_lost` подключение возвращается в `active` так же, как из `draft` - после замены учётных данных (`updateConnection`), новой успешной пробы и `activateConnection`; сбор продолжается с сохранённого курсора и заканчивается сверкой.
        adapter_kind: {type: string, enum: [builtin, client]}
        access_mode: {type: string, enum: [service_account, user_token, synced]}
        webhook_url: {type: [string, 'null'], format: uri, description: 'Адрес `receiveWebhook` этого подключения для настройки в источнике; `null`, если адаптер не поддерживает webhook. Секрет подписи вводится вместе с учётными данными и хранится адаптером.'}
        credentials_set_at: {type: [string, 'null'], format: date-time, description: Учётные данные заданы; их значение не возвращается.}
        sync_paused: {type: boolean}
        paused_until: {type: [string, 'null'], format: date-time, description: Пауза лимита источника по `Retry-After`.}
        last_success_at: {type: [string, 'null'], format: date-time}
        scopes: {type: array, items: {$ref: '#/components/schemas/ConnectionScope'}}
        capabilities: {type: array, items: {$ref: '#/components/schemas/Capability'}}
    ConnectionPage:
      type: object
      required: [data, next_cursor]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/Connection'}}
        next_cursor: {type: [string, 'null']}
    Credentials:
      type: object
      writeOnly: true
      description: Учётные данные в формате адаптера. Передаются адаптеру и не сохраняются ядром; в ответах отсутствуют.
      additionalProperties: {type: string, maxLength: 8192}
      maxProperties: 16
    ConnectionCreate:
      type: object
      additionalProperties: false
      required: [name, provider, base_url, adapter_kind, adapter_url, adapter_key, credentials, scopes]
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
        provider: {$ref: '#/components/schemas/Provider'}
        base_url: {type: string, format: uri, pattern: '^(https|ssh)://', maxLength: 2048, description: 'Адрес источника. `ssh://` принимается только для адаптера `git`; для остальных адаптеров - 422.'}
        adapter_kind: {type: string, enum: [builtin, client]}
        adapter_url: {type: [string, 'null'], format: uri, pattern: '^https://', description: Обязателен для адаптера клиента.}
        adapter_key: {type: [string, 'null'], writeOnly: true, maxLength: 512, description: Ключ адаптера клиента; хранится зашифрованным в `connect`.}
        credentials: {$ref: '#/components/schemas/Credentials'}
        scopes: {type: array, minItems: 1, maxItems: 500, items: {$ref: '#/components/schemas/ConnectionScopeInput'}}
    ConnectionPatch:
      type: object
      additionalProperties: false
      description: JSON Merge Patch. Отсутствующее поле не меняется.
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
        base_url: {type: string, format: uri, pattern: '^(https|ssh)://', maxLength: 2048}
        adapter_url: {type: string, format: uri, pattern: '^https://'}
        adapter_key: {type: string, writeOnly: true, maxLength: 512}
        credentials: {$ref: '#/components/schemas/Credentials'}
        scopes: {type: array, maxItems: 500, items: {$ref: '#/components/schemas/ConnectionScopeInput'}}
        sync_paused: {type: boolean}
    ConnectionProbe:
      type: object
      required: ["id","status","started_at","finished_at","edition","source_version","contract_version","capabilities","reason_code","retry_after_seconds","configuration_version"]
      properties:
        id: {type: string, format: uuid}
        status: {type: string, enum: [pending, running, succeeded, failed]}
        started_at: {type: string, format: date-time}
        finished_at: {type: [string, 'null'], format: date-time}
        edition: {type: [string, 'null']}
        source_version: {type: [string, 'null']}
        contract_version: {type: [string, 'null']}
        capabilities: {type: array, items: {$ref: '#/components/schemas/Capability'}}
        reason_code:
          type: [string, 'null']
          description: "Причина неуспеха: `edition_mismatch`, `auth_failed`, `outside_network_scope`, `certificate_untrusted`, `timeout`, `adapter_unavailable`, `contract_unsupported`. Изменение конфигурации во время пробы - configuration_changed."
        retry_after_seconds: {type: [integer, 'null'], minimum: 1}
        configuration_version:
          type: integer
          minimum: 1
          description: row_version подключения, для которой выполнена проба; сверяется при активации.
    ConnectionActivation:
      type: object
      additionalProperties: false
      required: [probe_id]
      properties:
        probe_id: {type: string, format: uuid}
    SyncDataKindStatus:
      type: object
      required: [data_kind, phase, last_attempt_at, last_outcome, last_error_code, failed_page_present, last_success_at, watermark, lag_seconds, history_from, completeness, unknown_fields, affected_metrics]
      properties:
        data_kind: {$ref: '#/components/schemas/DataKind'}
        phase: {type: string, enum: [backfill, incremental, paused, stopped]}
        last_attempt_at: {type: [string, 'null'], format: date-time}
        last_outcome: {type: [string, 'null'], enum: [success, partial, error, null]}
        last_error_code: {type: [string, 'null'], description: '`unauthorized`, `forbidden`, `rate_limited`, `unavailable`, `timeout`, `adapter_unavailable`, `invalid_response`.'}
        failed_page_present: {type: boolean, description: 'Есть страница, на которой сбор остановился; повтор продолжит с неё.'}
        last_success_at: {type: [string, 'null'], format: date-time}
        watermark: {type: [string, 'null'], format: date-time, description: 'Время, до которого выборка подтверждена сверкой.'}
        lag_seconds: {type: [integer, 'null'], minimum: 0}
        history_from: {type: [string, 'null'], format: date-time}
        completeness: {type: string, enum: [complete, partial, unknown]}
        unknown_fields: {type: array, items: {type: string}}
        affected_metrics: {type: array, items: {type: string}}
    SyncStatus:
      type: object
      required: [connection_id, connection_status, paused_until, data_kinds, last_reconcile]
      properties:
        connection_id: {type: string, format: uuid}
        connection_status: {type: string, enum: [draft, active, access_lost, deleted]}
        paused_until: {type: [string, 'null'], format: date-time}
        data_kinds: {type: array, items: {$ref: '#/components/schemas/SyncDataKindStatus'}}
        last_reconcile:
          type: [object, 'null']
          required: [started_at, finished_at, outcome, expected_count, observed_count, missing_count, changed_count]
          properties:
            started_at: {type: string, format: date-time}
            finished_at: {type: [string, 'null'], format: date-time}
            outcome: {type: string, enum: [running, complete, incomplete, failed]}
            expected_count: {type: [integer, 'null']}
            observed_count: {type: [integer, 'null']}
            missing_count: {type: [integer, 'null']}
            changed_count: {type: [integer, 'null']}
        webhooks:
          type: [object, 'null']
          description: Диагностика webhook подключения; `null`, если webhook не поддерживается или ещё не приходил.
          required: [last_received_at, rejected_count, last_rejected_at, last_reject_reason]
          properties:
            last_received_at: {type: [string, 'null'], format: date-time}
            rejected_count: {type: integer, minimum: 0, description: Отклонённые доставки за последние 24 ч.}
            last_rejected_at: {type: [string, 'null'], format: date-time}
            last_reject_reason: {type: [string, 'null'], description: '`signature_invalid`, `payload_invalid`, `adapter_unavailable`.'}
    SyncRunRequest:
      type: object
      additionalProperties: false
      required: [kind, data_kind]
      properties:
        kind: {type: string, enum: [resume, reconcile]}
        data_kind: {$ref: '#/components/schemas/DataKind'}
    CiCheckProfile:
      type: object
      required: [project_id, profile_version_no, entries, expected_reports, documentation_roots, limits]
      properties:
        project_id: {type: string, format: uuid}
        profile_version_no: {type: integer, minimum: 1}
        entries:
          type: array
          items:
            type: object
            required: [component_id, path_prefix, language, analysis_kind, mode, profile_id, image_digest]
            properties:
              component_id: {type: string, format: uuid}
              path_prefix: {type: string}
              language: {type: string}
              analysis_kind: {$ref: '#/components/schemas/AnalysisKind'}
              mode: {type: string, enum: [import, builtin]}
              profile_id: {type: string}
              image_digest: {type: [string, 'null'], pattern: '^sha256:[0-9a-f]{64}$', description: 'Образ штатного профиля; `null` для режима импорта.'}
        expected_reports: {type: array, items: {$ref: '#/components/schemas/AnalysisKind'}}
        documentation_roots:
          type: array
          description: Корни документации проекта для профилей `docs` и `openapi` (UC-36); пусто, если корни не назначены.
          items:
            type: object
            required: [root_id, kind, path_prefix]
            properties:
              root_id: {type: string, format: uuid}
              kind: {type: string, enum: [docs, openapi]}
              path_prefix: {type: string, description: Путь корня в репозитории; пустая строка - корень репозитория.}
        limits:
          type: object
          required: [max_package_bytes, max_unpacked_bytes, max_files]
          properties:
            max_package_bytes: {type: integer}
            max_unpacked_bytes: {type: integer}
            max_files: {type: integer}
    AnalysisKind:
      type: string
      enum: [code, sast, sca, secrets, iac, image, junit, coverage, docs, openapi, sonar]
    ImportUpload:
      type: object
      required: [file, schema_id, schema_version, source_provider, source_instance_key, project_id]
      properties:
        file: {type: string, contentMediaType: application/octet-stream, description: 'Файл по схеме импорта: JSON или CSV для фактов, отчёт поддержанного формата для `findings`, `junit` и `coverage`.'}
        schema_id: {type: string, enum: [tasks, task_events, relations, merge_requests, ci_runs, findings, junit, coverage, documents], description: '`merge_requests` и `ci_runs` несут те же факты MR, запусков, jobs и попыток, что отдают адаптеры Git и CI.'}
        report_format: {type: string, enum: [envelope, sarif, gitlab_security, gitlab_code_quality, junit_xml, lcov, cobertura, jacoco], description: 'Формат файла для `findings`, `junit` и `coverage`; для остальных схем не передаётся. `envelope` - находки в формате универсального импорта.'}
        commit_sha: {type: string, pattern: '^([0-9a-f]{40}|[0-9a-f]{64})$', description: 'Ревизия, к которой относится отчёт; обязательна для `findings`, `junit` и `coverage`. Без неё отчёт отклоняется: результат не привязывается к head по догадке.'}
        schema_version: {type: string, maxLength: 16}
        source_provider: {$ref: '#/components/schemas/Provider'}
        source_instance_key: {type: string, maxLength: 512, description: Экземпляр системы-источника; совпадение с подключённым экземпляром даёт те же идентичности (раздел 12.4).}
        project_id: {type: string, format: uuid}
        snapshot: {type: boolean, default: false, description: Файл содержит только текущее состояние без истории (CSV); прошлый WIP из него не строится.}
    Receipt:
      type: object
      required: [id, channel, status, received_at, schema_id, schema_version, record_count, accepted_count, rejected_count, replay_count, conflict_count, reason_code, duplicate_of, affected_metrics, retry_after_seconds, result_url]
      properties:
        id: {type: string, format: uuid}
        channel: {type: string, enum: [sync, ci, import]}
        status: {type: string, enum: [quarantined, accepted, partial, rejected, duplicate]}
        received_at: {type: string, format: date-time}
        schema_id: {type: [string, 'null']}
        schema_version: {type: [string, 'null']}
        record_count: {type: integer, minimum: 0}
        accepted_count: {type: integer, minimum: 0}
        rejected_count: {type: integer, minimum: 0}
        replay_count: {type: integer, minimum: 0}
        conflict_count: {type: integer, minimum: 0}
        reason_code: {type: [string, 'null'], description: 'Причина отказа пакета целиком: `schema_unsupported`, `envelope_invalid`, `path_unsafe`, `limit_exceeded`.'}
        duplicate_of: {type: [string, 'null'], format: uuid}
        affected_metrics: {type: array, items: {type: string}}
        retry_after_seconds: {type: [integer, 'null'], minimum: 1}
        result_url: {type: [string, 'null'], format: uri-reference, description: 'Экран с результатом, если он доступен субъекту.'}
    ReceiptSummary:
      type: object
      required: [id, channel, status, received_at, schema_id, schema_version, record_count, accepted_count, rejected_count, reason_code, duplicate_of, affected_metrics]
      properties:
        id: {type: string, format: uuid}
        channel: {type: string, enum: [sync, ci, import]}
        status: {type: string, enum: [quarantined, accepted, partial, rejected, duplicate]}
        received_at: {type: string, format: date-time}
        schema_id: {type: [string, 'null']}
        schema_version: {type: [string, 'null']}
        record_count: {type: integer}
        accepted_count: {type: integer}
        rejected_count: {type: integer}
        reason_code: {type: [string, 'null']}
        duplicate_of: {type: [string, 'null'], format: uuid}
        affected_metrics: {type: array, items: {type: string}}
    ReceiptPage:
      type: object
      required: [data, next_cursor]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/ReceiptSummary'}}
        next_cursor: {type: [string, 'null']}
    ReceiptRecord:
      type: object
      required: [record_no, record_kind, native_key, outcome, reason_code]
      properties:
        record_no: {type: integer, minimum: 1}
        record_kind: {type: string}
        native_key: {type: [string, 'null'], description: 'Исходные координаты записи для показа; `null`, если идентичность не определена.'}
        outcome: {type: string, enum: [accepted, replay, conflict, rejected, suppressed]}
        reason_code: {type: [string, 'null']}
    ReceiptRecordPage:
      type: object
      required: [data, next_cursor]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/ReceiptRecord'}}
        next_cursor: {type: [string, 'null']}
    IngestConflict:
      type: object
      required: [id, receipt_id, record_no, existing_receipt_id, existing_record_no, native_key, detected_at, status, resolution]
      properties:
        id: {type: string, format: uuid}
        receipt_id: {type: string, format: uuid}
        record_no: {type: integer}
        existing_receipt_id: {type: string, format: uuid}
        existing_record_no: {type: integer}
        native_key: {type: string}
        detected_at: {type: string, format: date-time}
        status: {type: string, enum: [open, resolved]}
        resolution: {type: [string, 'null'], enum: [source_corrected, kept_existing, accepted_new, null]}
    IngestConflictPage:
      type: object
      required: [data, next_cursor]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/IngestConflict'}}
        next_cursor: {type: [string, 'null']}
    IngestConflictResolutionInput:
      type: object
      additionalProperties: false
      required: [resolution]
      properties:
        resolution: {type: string, enum: [source_corrected, kept_existing, accepted_new]}
    WorkflowCatalog:
      type: object
      required: [instances, unmapped_statuses]
      properties:
        instances:
          type: array
          items:
            type: object
            required: [instance_id, provider, statuses, resolutions, issue_types, fields]
            properties:
              instance_id: {type: string, format: uuid}
              provider: {$ref: '#/components/schemas/Provider'}
              statuses:
                type: array
                items:
                  type: object
                  required: [native_id, name, source_category]
                  properties:
                    native_id: {type: string}
                    name: {type: string}
                    source_category: {type: [string, 'null'], description: Категория в трекере; смысла не задаёт.}
              resolutions:
                type: array
                items:
                  type: object
                  required: [native_id, name]
                  properties:
                    native_id: {type: string}
                    name: {type: string}
              issue_types:
                type: array
                items:
                  type: object
                  required: [native_id, name]
                  properties:
                    native_id: {type: string}
                    name: {type: string}
              fields:
                type: array
                items:
                  type: object
                  required: [native_id, name, value_type]
                  properties:
                    native_id: {type: string}
                    name: {type: string}
                    value_type: {type: string, enum: [string, number, option, user, date, other]}
        unmapped_statuses:
          type: array
          items: {$ref: '#/components/schemas/NativeStatusRef'}
    NativeStatusRef:
      type: object
      required: [instance_id, native_id]
      properties:
        instance_id: {type: string, format: uuid}
        native_id: {type: string}
    MappingRule:
      type: object
      additionalProperties: false
      description: |
        Правило сопоставления (раздел 12.5.6). Значение без правила остаётся неизвестным и не даёт начала или завершения.
        code_required_type отмечает ID типа задачи, для которого обязательна связь с MR (A20, T28);
        native_value пуст, meaning - code_required. Без таких правил A20 и T28 не рассчитываются.
        Правила acceptance_gate, epic_field и business_epic_value доступны с M1; на M0
        их передача даёт 422 с not_allowed_value у rule_kind. acceptance_gate отмечает
        ID статуса приёмки отдельно от основного смысла этого статуса; native_value пуст.
        epic_field задаёт ID поля связи с эпиком; native_value пуст. business_epic_value
        задаёт ID поля и его исходное значение, подтверждающее признак бизнес-эпика.

      required: [rule_kind, instance_id, native_ref, native_value, meaning, rank]
      properties:
        rule_kind: {type: string, enum: [status, resolution, issue_type, code_required_type, size_field, size_value, team_field, team_value, acceptance_gate, epic_field, business_epic_value]}
        instance_id: {type: string, format: uuid}
        native_ref: {type: string, minLength: 1, maxLength: 255}
        native_value: {type: string, maxLength: 255, description: Пустая строка для правил без значения.}
        meaning:
          type: string
          maxLength: 200
