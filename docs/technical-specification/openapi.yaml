      required: [id, job_key, config_fingerprint, attempt_no, outcome, native_status, allow_failure, failure_kind, runner_class, started_at, finished_at, duration_seconds, source_url]
      properties:
        id: {type: string, format: uuid}
        job_key: {type: string}
        config_fingerprint: {type: string, pattern: '^[0-9a-f]{64}$'}
        attempt_no: {type: integer, minimum: 1}
        outcome: {type: string, enum: [running, success, failed, canceled, skipped, unknown]}
        native_status: {type: string}
