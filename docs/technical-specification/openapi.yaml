            properties:
              task: {$ref: '#/components/schemas/ObjectRef'}
              from_team_id: {type: [string, 'null'], format: uuid}
              to_team_id: {type: [string, 'null'], format: uuid, description: '`null` - принимающая команда вне области пользователя.'}
              effective_at: {type: string, format: date-time}
              wait_seconds: {type: [integer, 'null'], minimum: 0}
        history_from: {type: [string, 'null'], format: date-time}
        next_cursor: {type: [string, 'null']}
        access_limited: {type: boolean}
        access_notes: {type: array, items: {$ref: '#/components/schemas/AccessNote'}}
    BackgroundOperation:
      type: object
      description: "Публичный дескриптор запуска, отдельный от задания очереди. queued/running: retry_after_seconds >= 1, result_uri и error равны null. succeeded: result_uri указывает на зафиксированный результат, error и retry_after_seconds равны null. failed: error заполнена, result_uri и retry_after_seconds равны null. Для sync_run результат - sync-status исходного подключения, для series_refresh - точная новая ревизия, для documentation_check - документы проверенного сервиса; пустые findings сами по себе не означают успешную проверку."
      required:
        - id
        - kind
        - status
        - created_at
        - updated_at
        - result_uri
        - error
        - retry_after_seconds
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
            - sync_run
            - series_refresh
            - documentation_check
        status:
          type: string
          enum:
            - queued
            - running
            - succeeded
            - failed
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        result_uri:
          type:
            - string
            - "null"
          format: uri-reference
        error:
          type:
            - object
            - "null"
          required:
            - code
            - correlation_id
          properties:
            code:
              type: string
              description: "Безопасный класс причины: source_unavailable, access_lost, calculation_failed или check_failed; неизвестный код клиент показывает как ошибку операции."
            correlation_id:
              type: string
              format: uuid
        retry_after_seconds:
          type:
            - integer
            - "null"
          minimum: 1
