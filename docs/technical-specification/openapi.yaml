  /connections/{connection_id}/sync-status:
    get:
      operationId: getSyncStatus
      summary: Состояние сбора подключения
      description: |
        По каждому виду данных - последняя попытка, последний успех, отставание, точка
        продолжения, страница с ошибкой, границы истории, неизвестные поля и затронутые
        показатели (FR-020). Ошибка, последний успешный снимок и полнота не объединяются в один
        статус.
      tags: [connections]
      x-craftpulse-action: sync.read
      x-craftpulse-delivery: M0
      x-craftpulse-trace: [FR-006, FR-015, FR-020, UC-05, UC-10, UI-11]
      parameters:
        - $ref: '#/components/parameters/ConnectionId'
      responses:
        '200':
          description: Состояние сбора.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SyncStatus'}
              example:
                connection_id: 0193a5b0-5555-7000-8000-000000000001
                connection_status: active
                paused_until: null
                data_kinds:
                  - data_kind: tasks
                    phase: incremental
                    last_attempt_at: '2026-11-08T03:00:00Z'
                    last_outcome: error
                    last_error_code: timeout
                    failed_page_present: true
                    last_success_at: '2026-11-07T03:12:00Z'
                    watermark: '2026-11-07T03:00:00Z'
                    lag_seconds: 111600
                    history_from: '2026-01-01T00:00:00Z'
                    completeness: partial
                    unknown_fields: [customfield_10031]
                    affected_metrics: [T08, T12]
                last_reconcile: {started_at: '2026-11-07T02:00:00Z', finished_at: '2026-11-07T02:04:00Z', outcome: complete, expected_count: 1240, observed_count: 1240, missing_count: 0, changed_count: 3}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /connections/{connection_id}/sync-runs:
    post:
      operationId: requestSyncRun
      summary: Запросить повтор сбора или сверку
      description: |
        Ставит сбор с сохранённой точки продолжения или сверку с манифестом источника
        (UI-11). Одна активная попытка на подключение: повтор во время идущей попытки ничего не
        добавляет (NFR-006). Подключение без доступа (`access_lost`) - `409 state_conflict`
        до замены учётных данных.

        Ответ содержит дескриптор запуска; GET по Location возвращает queued/running/succeeded/failed,
        задержку опроса и безопасную ошибку. Ссылка result_uri появляется после успеха.
        Повтор с теми же параметрами во время активного запуска возвращает тот же id.
        Иные параметры для этого ресурса во время запуска дают 409 state_conflict;
        после завершения новый запрос создаёт новый запуск.
      tags: [connections]
      x-craftpulse-action: connections.manage
      x-craftpulse-delivery: M0
      x-craftpulse-trace: [FR-006, FR-015, UC-05, UC-10, UI-11]
      parameters:
        - $ref: '#/components/parameters/ConnectionId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SyncRunRequest'}
            example: {kind: resume, data_kind: tasks}
      responses:
        '202':
          description: "Операция принята. Location указывает на getBackgroundOperation; её статус и ошибка относятся к этому запуску."
          headers:
            Location: {"description":"Адрес ресурса принятой операции.","schema":{"type":"string","format":"uri-reference"},"example":"/api/v1/operations/0193a5b0-a0a0-7000-8000-000000000001"}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackgroundOperation"
              example:
                id: 0193a5b0-a0a0-7000-8000-000000000001
                kind: sync_run
                status: queued
                created_at: 2026-11-08T12:00:00Z
                updated_at: 2026-11-08T12:00:00Z
                result_uri: null
                error: null
                retry_after_seconds: 3
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /webhooks/{route_id}:
    post:
      operationId: receiveWebhook
      summary: Принять webhook источника
      description: |
        Адрес содержит случайный ID маршрута подключения; полный адрес для настройки в
        источнике отдаёт `Connection.webhook_url`. `api` проверяет только маршрут и
        размер тела и сразу отвечает `200`; подпись проверяет адаптер в задании
        `sync.webhook`, а webhook служит только сигналом к перечитыванию (раздел 10.6).
        Неверная подпись не меняет ответ отправителю, но учитывается в диагностике.
      tags: [webhooks]
      security: []
      x-craftpulse-action: public
      x-craftpulse-delivery: M0
      x-craftpulse-trace: [FR-015, UC-05]
      parameters:
        - {name: route_id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        description: Тело в формате источника, не больше 1 MiB.
        content:
          application/json:
            schema: {type: object}
            example: {object_kind: merge_request, object_attributes: {id: 10342, iid: 42, action: update}}
      responses:
        '200': {description: Webhook принят к обработке.}
        '404': {$ref: '#/components/responses/NotFound'}
        '413': {$ref: '#/components/responses/ContentTooLarge'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /ci/check-profile:
    get:
      operationId: getCiCheckProfile
      summary: Профиль проверок проекта для шага CI
      description: |
        Читает `craftpulse-ci` по токену загрузки: действующая матрица проверок проекта, версии
        образов профилей, ожидаемые отчёты и пределы пакета (UC-25). Токен даёт доступ только
        к своему проекту.
