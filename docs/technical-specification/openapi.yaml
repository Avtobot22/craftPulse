openapi: 3.1.2
info:
  title: craftPulse HTTP API
  version: 1.0.0
  summary: HTTP-контракт craftPulse для SPA, CI клиента, универсального импорта, BI и webhook источников.
  description: |
    Контракт первичен: серверные интерфейсы Go и типы frontend генерируются из этого файла
    (раздел 11 ТЗ). Карта операций и связи с UC/FR - раздел 5 ТЗ, механизмы входа и
    проверки прав - раздел 13, модель данных - раздел 12.

    Общие правила контракта:

    - Все операции, кроме входа и webhook, находятся под `/api/v1`. Версия меняется только
      при несовместимой перестройке; совместимые изменения добавляют поля и операции.
    - Организация запроса берётся из сессии, ключа API или токена загрузки и в адресе не
      передаётся. Объект другой организации, закрытый объект и несуществующий объект дают
      одинаковый ответ `404` с кодом `not_found`.
    - Ошибки - RFC 9457 (`application/problem+json`) со стабильным полем `code` и
      `correlation_id`. Клиент ветвится по `code`, текст `detail` не разбирает.
    - Имена полей - `snake_case`; время - RFC 3339 в UTC (`2026-10-01T00:00:00Z`);
      длительности - целые секунды в полях `*_seconds` или миллисекунды в `*_ms`;
      деньги - строка-decimal с отдельной валютой ISO 4217.
    - Значения перечислений - стабильные строки. Клиент обязан принимать неизвестное
      значение и показывать его как неизвестное: новые значения добавляются без новой версии.
      Клиент игнорирует неизвестные поля ответа.
    - Сервер отклоняет неизвестные параметры запроса (`400 unknown_parameter`) и неизвестные
      поля тела (`422 validation_failed`, причина `unknown_field`).
    - Необязательное поле, закрытое правами, в ответе отсутствует, а его имя перечислено в `redactions`.
      Объекты вне разрешённой области не дают ни строк, ни количества; ответ помечается
      `access_limited: true` без числа скрытых объектов.
    - `null` означает, что значения нет. Обязательность поля задаётся `required` его схемы.
      Обязательные поля схемы не маскируются отдельно: отсутствие права закрывает весь объект.
      Необязательное поле, закрытое правами, отсутствует и перечислено в `redactions`; остальные
      необязательные поля можно не передавать по условиям схемы.
      Частичное обновление - JSON Merge Patch (RFC 7396): `null` очищает поле, отсутствующее
      поле не меняется.
    - Коллекции возвращают `{data, next_cursor}`. Курсор непрозрачен, `limit` по умолчанию
      50, максимум 200. Сортировка - из перечисленных в операции полей, вторым ключом всегда
      идёт `id`.
    - Изменение версионируемого ресурса требует `If-Match` со значением `ETag` прочитанной
      версии: устаревшая версия даёт `412 version_conflict`, отсутствие заголовка -
      `428 precondition_required`. Для первой версии ресурса без версий передаётся `If-Match: "0"`.
    - Подтверждение, создающее версию или решение, требует `Idempotency-Key` (UUID на одну
      попытку пользователя). Повтор с тем же ключом возвращает сохранённый результат; тот же
      ключ с другим телом - `422 idempotency_key_reused`. Ключ живёт столько же, сколько
      созданная им запись (раздел 12.9 ТЗ, класс `DECISIONS`).
    - Изменяющий запрос с cookie сессии принимается только с заголовком `Origin`, равным
      адресу сайта; иначе `403 origin_rejected` без выполнения (SEC-09).
    - У каждой операции есть `x-craftpulse-action` - действие, которое проверяет `access`
      (раздел 13.4 ТЗ); `x-craftpulse-delivery` - поставка, с которой операция доступна;
      `x-craftpulse-trace` - связанные FR, UC и UI.

    Долгие запросы requestSyncRun, refreshSeries и requestDocumentationCheck возвращают
    BackgroundOperation и Location на getBackgroundOperation. Другие долгие запросы
    используют собственные ресурсы: квитанцию, пробу, выгрузку, прогноз или черновик.
    Запись ключа идемпотентности включает организацию, субъекта, operationId, целевой ресурс
    и хэш тела; сохранённый ответ возвращается до проверки уже изменившегося If-Match.
  contact:
    name: Команда craftPulse
    url: https://github.com/Avtobot22/craftPulse
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: https://craftpulse.example/api/v1
    description: Адрес установки craftPulse. Операции входа адресуются от корня сайта, их адрес задан в `servers` операций; webhook принимается по адресу `/api/v1/webhooks/{route_id}`.
security:
  - cookieSession: []
tags:
  - name: session
    description: Вход, сессия и текущий пользователь (UC-03, раздел 13).
  - name: organization
    description: Структура организации, пользователи, роли и учётные записи источников (UC-02, UC-03, UC-08).
  - name: credentials
    description: Ключи API, токены загрузки CI и доступ пользователя к источникам (разделы 7.2, 13.3, 13.6).
  - name: connections
    description: Подключения источников, пробное чтение и состояние сбора (UC-04, UC-05, UC-10).
  - name: ingest
    description: Приём пакетов из CI и универсального импорта, квитанции и конфликты (UC-06, UC-25).
  - name: process
    description: Сопоставление workflow, календарь, целевые сроки и DoD (UC-07, UC-09, UC-16).
  - name: reports
    description: Отчёты, ряды показателей, паспорт и когорта раскрытия, сохранённые срезы (UC-11, UC-13).
  - name: exports
    description: Выгрузки и машинное чтение для BI (UC-12).
  - name: tasks
    description: Задачи, история, таймлайн проекта, связи и очередь ревью (UC-14, UC-19-UC-21).
  - name: changes
    description: MR, сводка head, pipeline, попытки, тесты, матрица проверок и базовые линии (UC-25, UC-26, UC-29).
  - name: findings
    description: Находки, обзор компонента, причины изменения результата и исключения (UC-27, UC-28, UC-30, UC-32).
  - name: documentation
    description: Корни документации, документы и повторная проверка (UC-36, UC-37).
  - name: webhooks
    description: Приём webhook источников (раздел 10.6).
  - name: installation
    description: Протокол проверки установки и аудит (UC-01, раздел 13.8).
  - name: m1
    description: Операции поставки M1 - зеркала, спринты, DoD, инициативы, бизнес-цепочка, политика, выпуск, техдолг, обязательства документации, передача проекта.
  - name: m2
    description: Операции поставки M2 - прогноз, маршрут ревью, отбор тестов, учения, поиск, опрос, стабильность поставки, стоимость CI, передачи между командами.
paths:
  /o/{org_slug}/login:
    servers:
      - url: https://craftpulse.example
    get:
      operationId: startLogin
      summary: Начать вход через провайдера организации
      description: |
        Создаёт запись предвхода (`state`, `nonce`, PKCE) на 10 минут и перенаправляет браузер к
        OIDC-провайдеру организации (раздел 13.1). `return_to` принимается только как
        относительный путь сайта. Несуществующая организация даёт ту же страницу ошибки входа,
        что и недоступный провайдер, без сведений об организации.
      tags: [session]
      security: []
      x-craftpulse-action: public
      x-craftpulse-delivery: M0
      x-craftpulse-trace: [FR-013, UC-03, UI-02]
      parameters:
        - name: org_slug
          in: path
          required: true
          schema:
            type: string
            pattern: ^[a-z0-9-]{2,40}$
        - name: return_to
          in: query
          description: Относительный путь сайта. После декодирования и нормализации запрещены //, обратная косая черта и управляющие символы; итоговый origin должен совпадать с origin установки.
          schema:
            type: string
            pattern: ^/(?:[^/\\\u0000-\u0020][^\\\u0000-\u0020]*)?$
            maxLength: 2048
      responses:
        '302':
          description: Переход к провайдеру. Устанавливается cookie `__Host-cp_login`.
          headers:
            Location: {$ref: '#/components/headers/Location'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /o/{org_slug}/callback:
    servers:
      - url: https://craftpulse.example
    get:
      operationId: completeLogin
      summary: Завершить вход по ответу провайдера
      description: |
        Проверяет `state`, `iss`, обменивает code с PKCE, проверяет ID-токен и создаёт сессию
        (раздел 13.1, шаги 4-8). Первый вход учётной записи, заданной при установке,
        назначает роль администратора (FR-064). Любая ошибка не создаёт сессию и ведёт на
        страницу входа UI-03 с классом причины в параметре `login_error`.
      tags: [session]
      security: []
      x-craftpulse-action: public
      x-craftpulse-delivery: M0
      x-craftpulse-trace: [FR-013, FR-064, UC-03, UC-01, UI-02, UI-03, UI-06]
      parameters:
        - {name: org_slug, in: path, required: true, schema: {type: string, pattern: '^[a-z0-9-]{2,40}$'}}
        - {name: code, in: query, schema: {type: string, maxLength: 4096}}
        - {name: state, in: query, required: true, schema: {type: string, maxLength: 512}}
        - {name: iss, in: query, schema: {type: string, format: uri}}
        - {name: error, in: query, schema: {type: string, maxLength: 256}}
      responses:
        '302':
          description: |
            Успех - переход на сохранённый путь с cookie `__Host-cp_session`. Отказ - переход на
            страницу входа с `login_error` одним из `provider_unavailable`, `provider_rejected`,
            `invalid_response`, `organization_not_configured`, `user_blocked`.
          headers:
            Location: {$ref: '#/components/headers/Location'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /session/logout:
    post:
      operationId: logout
      summary: Выйти из текущей сессии
      description: Ставит отметку завершения текущей сессии и удаляет cookie. Остальные сессии пользователя продолжают работать (раздел 7.2). Повтор с уже завершённой сессией даёт `401`.
      tags: [session]
      x-craftpulse-action: session.manage
      x-craftpulse-delivery: M0
      x-craftpulse-trace: [FR-002, UC-03, UI-01]
      responses:
        '204': {description: Сессия завершена.}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /me:
    get:
      operationId: getCurrentUser
      summary: Получить текущего пользователя, организацию, роли и доступные действия
      description: |
        Данные для оболочки UI-01. Роли и область читаются при каждом запросе, поэтому их смена
        видна без повторного входа. Пользователь без области получает `areas` с пустыми
        списками и показывает экран «Нет доступной области».
      tags: [ session ]
      x-craftpulse-action: session.read
      x-craftpulse-delivery: M0
      x-craftpulse-trace: [ FR-001, FR-013, UC-03, UI-01 ]
      responses:
        '200':
          description: Текущий пользователь.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUser' }
              example:
                user: { id: 0193a5b0-1111-7000-8000-000000000001, display_name: Анна Смирнова, status: active, person_id: 0193a5b0-2222-7000-8000-000000000001 }
                organization: { id: 0193a5b0-0000-7000-8000-000000000001, name: Пример, slug: example, status: active }
                roles:
                  - { role: dev_lead, team_id: 0193a5b0-3333-7000-8000-000000000001, project_id: null, service_id: null, assigned_at: '2026-10-01T09:00:00Z' }
                areas:
                  teams: [ { id: 0193a5b0-3333-7000-8000-000000000001, name: Платформа, status: active } ]
                  projects: [ { id: 0193a5b0-4444-7000-8000-000000000001, name: Core, status: active } ]
                  services: []
                actions: [ session.read, report.read, tasks.read, export.create ]
                session: { expires_at: '2026-11-08T21:00:00Z', idle_expires_at: '2026-11-08T10:00:00Z' }
                review_participation:
                  participates: false
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me/review-participation:
    put:
      operationId: setReviewParticipation
      summary: Включить или выключить участие в рекомендациях ревью
      description: Личная настройка UI-69. Отказ исключает пользователя из групп рекомендованных ревьюеров (FR-050 A2). Повтор с тем же значением ничего не меняет.
      tags: [m2]
      x-craftpulse-action: profile.manage
      x-craftpulse-delivery: M1
      x-craftpulse-trace: [FR-050, UC-40, UI-69]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReviewParticipation'}
            example: {participates: false}
      responses:
        '200':
          description: Сохранённая настройка.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReviewParticipation'}
              example: {participates: false}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /me/source-links:
    get:
      operationId: listSourceLinks
      summary: Список подключений, которым нужен доступ пользователя
      description: Подключения с режимом проверки прав токеном пользователя, например Confluence DC (раздел 13.5), и состояние связи пользователя с каждым.
      tags: [credentials]
      x-craftpulse-action: profile.manage
      x-craftpulse-delivery: M0
      x-craftpulse-trace: [FR-001, UC-03, UI-04, UI-73]
      responses:
        '200':
          description: Подключения и состояние связи.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SourceLinkList'}
              example:
                data:
                  - {connection_id: 0193a5b0-5555-7000-8000-000000000003, provider: confluence_dc, display_name: Confluence, state: not_linked, linked_at: null}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /me/source-links/{connection_id}/authorization:
    post:
      operationId: startSourceLink
      summary: Начать разрешение доступа к источнику через OAuth 2.0
      description: 'Возвращает адрес авторизации источника с одноразовым `state` (раздел 13.6). Адрес строит адаптер подключения (`AuthorizeUrl`): идентификатор клиента OAuth и адрес авторизации знает только он. Браузер переходит по адресу, источник возвращает код на `completeSourceLink`. `return_to` принимается только как относительный путь сайта; без него возврат идёт на UI-73.'
      tags: [credentials]
      x-craftpulse-action: profile.manage
      x-craftpulse-delivery: M0
      x-craftpulse-trace: [FR-001, UC-03, UI-04, UI-73]
      parameters:
        - $ref: '#/components/parameters/ConnectionId'
        - {name: return_to, in: query, description: 'Относительный путь сайта для возврата после связывания; правила те же, что у `startLogin`.', schema: {type: string, maxLength: 2048}}
      responses:
        '200':
          description: Адрес авторизации.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthorizationRedirect'}
              example: {authorization_url: 'https://wiki.example/rest/oauth2/latest/authorize?client_id=cp&response_type=code&scope=READ&state=Zm9v'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
    delete:
      operationId: deleteSourceLink
      summary: Отозвать доступ craftPulse к источнику от имени пользователя
      description: Адаптер удаляет токены пользователя (`DeleteCredentials`); документы этого источника закрываются для пользователя. Повтор даёт тот же результат.
      tags: [credentials]
      x-craftpulse-action: profile.manage
      x-craftpulse-delivery: M0
      x-craftpulse-trace: [FR-001, UC-03, UI-73]
      parameters:
        - $ref: '#/components/parameters/ConnectionId'
      responses:
        '204': {description: Доступ отозван или не был выдан.}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /source-links/callback:
    get:
      operationId: completeSourceLink
      summary: Принять код авторизации источника
      description: Проверяет одноразовый `state`, передаёт код адаптеру через `PutCredentials` и возвращает браузер на сохранённый `return_to` или на экран доступа к источникам UI-73. Токены в браузер не попадают.
      tags: [credentials]
      x-craftpulse-action: profile.manage
      x-craftpulse-delivery: M0
      x-craftpulse-trace: [FR-001, UC-03, UI-73]
      parameters:
        - {name: code, in: query, schema: {type: string, maxLength: 4096}}
        - {name: state, in: query, required: true, schema: {type: string, maxLength: 512}}
        - {name: error, in: query, schema: {type: string, maxLength: 256}}
      responses:
        '302':
          description: Переход на `return_to` или UI-73 с исходом `linked` или `link_failed`.
          headers:
            Location: {$ref: '#/components/headers/Location'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /organization/structure:
    get:
      operationId: getOrganizationStructure
      summary: Получить структуру организации
      description: Команды, проекты, сервисы, компоненты с предложениями из manifests, участники команд и области источников проектов (UC-02). `ETag` - версия структуры.
      tags: [organization]
      x-craftpulse-action: org.manage
      x-craftpulse-delivery: M0
      x-craftpulse-trace: [FR-012, UC-02, UI-07]
      responses:
        '200':
          description: Структура и её версия.
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OrganizationStructure'}
              example:
                version: 7
                teams: [{id: 0193a5b0-3333-7000-8000-000000000001, name: Платформа, status: active}]
                projects: [{id: 0193a5b0-4444-7000-8000-000000000001, name: Core, status: active}]
                services: [{id: 0193a5b0-6666-7000-8000-000000000001, name: billing, status: active}]
                components:
                  - {id: 0193a5b0-7777-7000-8000-000000000001, service_id: 0193a5b0-6666-7000-8000-000000000001, repository_area_id: 0193a5b0-8888-7000-8000-000000000001, path_prefix: services/billing, status: proposed, origin: manifest}
                team_projects: [{team_id: 0193a5b0-3333-7000-8000-000000000001, project_id: 0193a5b0-4444-7000-8000-000000000001, valid_from: '2026-10-01T00:00:00Z', valid_to: null}]
                project_areas: [{project_id: 0193a5b0-4444-7000-8000-000000000001, area_id: 0193a5b0-8888-7000-8000-000000000001, valid_from: '2026-10-01T00:00:00Z', valid_to: null}]
                team_members: [{team_id: 0193a5b0-3333-7000-8000-000000000001, person_id: 0193a5b0-2222-7000-8000-000000000001, valid_from: '2026-10-01T00:00:00Z', valid_to: null}]
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    put:
      operationId: replaceOrganizationStructure
      summary: Подтвердить новую структуру организации
      description: |
        Полная замена структуры, которую администратор просмотрел в UI-17. Предложенный
        компонент действует только после включения в тело со статусом `confirmed`. На M0
        интервалы принимают текущий момент; даты действия - M1. Перекрытие интервалов одной
        пары - `422` (ограничение `EXCLUDE`, раздел 12.5.1). Операция идемпотентна: повтор того
        же тела с новым `If-Match` ничего не меняет.
      tags: [organization]
      x-craftpulse-action: org.manage
      x-craftpulse-delivery: M0
      x-craftpulse-trace: [FR-012, FR-007, FR-008, UC-02, UI-07, UI-17]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OrganizationStructureInput'}
            example:
              teams: [{id: 0193a5b0-3333-7000-8000-000000000001, name: Платформа, status: active}]
