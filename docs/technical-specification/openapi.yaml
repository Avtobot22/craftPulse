        link_type: { type: string, enum: [ task_mr, mr_run, run_report, task_parent, finding_task, document_service, task_task, deployment_incident, incident_deployment ], description: "deployment_incident: from_object_id развёртывания вызвал to=incident (I39/I40). incident_deployment: from_object_id инцидента вызвал to=deployment, внеплановый выпуск (I41). Подтверждение требует текущего доступа к обоим концам." }
        method: { type: string, enum: [ source_explicit, user_confirmed, branch_key, title_key, time_window, path_match ] }
        status: { type: string, enum: [ candidate, confirmed, rejected ] }
        from_object_id: { type: string, format: uuid }
        to: { $ref: '#/components/schemas/ObjectRef' }
        decided_at: { type: [ string, 'null' ], format: date-time }
    LinkDecision:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision: {type: string, enum: [confirm, reject]}
    TaskDetail:
      type: object
      required: [id, key, title, project_id, status, task_type, size_label, team_id, age_seconds, over_target, updated_at, source_url, target, blocked_intervals, observations, links, redactions]
      properties:
        id: {type: string, format: uuid}
        key: {type: [string, 'null']}
        title: {type: [string, 'null']}
        project_id: {type: [string, 'null'], format: uuid}
        status: {$ref: '#/components/schemas/TaskStatus'}
        task_type: {type: [string, 'null']}
        size_label: {type: [string, 'null']}
        team_id: {type: [string, 'null'], format: uuid}
        age_seconds: {type: [integer, 'null']}
        over_target: {type: [boolean, 'null']}
        updated_at: {type: [string, 'null'], format: date-time}
        source_url: {type: [string, 'null'], format: uri}
        target:
          type: [object, 'null']
          required: [duration_seconds, version_no]
          properties:
            duration_seconds: {type: integer}
            version_no: {type: integer}
        blocked_intervals:
          type: array
          items:
            type: object
            required: [from, to]
            properties:
              from: {type: string, format: date-time}
              to: {type: [string, 'null'], format: date-time, description: '`null` - блокировка открыта на as_of.'}
        observations:
          type: array
          description: |
            Наблюдения о текущем эпизоде задачи по основаниям (FR-029), от самого раннего. У задачи их может быть
            несколько: например, MR без ревьюера и успешный pipeline после повторов. Если фактов для вывода
            не хватает, список содержит одно наблюдение `unknown` с действием `clarify_reason`; причина
            задержки не придумывается. Наблюдения о находках и отчётах строятся только по доступным
            пользователю данным.
          minItems: 1
          items:
            type: object
            required: [kind, since, basis, action]
            properties:
              kind:
                type: string
                enum: [awaiting_reviewer, awaiting_first_response, ci_failed, ci_running, ci_passed_after_retry, missing_report, new_finding, blocked, no_merge_request, over_target, unknown]
                description: '`ci_passed_after_retry` - pipeline текущего head успешен после повторных попыток; `missing_report` - не получен отчёт, ожидаемый по профилю; `new_finding` - новая находка относительно сопоставимой базы в связанном MR.'
              since: {type: [string, 'null'], format: date-time}
              basis: {type: array, items: {$ref: '#/components/schemas/ObjectRef'}}
              action:
                type: string
                enum: [assign_reviewer, request_review, check_pipeline, restore_report, review_finding, resolve_blocker, link_merge_request, review_target, clarify_reason]
                description: Следующее доступное действие; выполняется пользователем в исходной системе или на экране craftPulse. `clarify_reason` - вопрос к исполнителю, когда данных для вывода нет.
        links: {type: array, items: {$ref: '#/components/schemas/Link'}}
        redactions: {$ref: '#/components/schemas/Redactions'}
    ReviewWait:
      type: [object, 'null']
      required: [kind, since, wait_seconds, fallback_open]
      properties:
        kind: {type: string, enum: [no_reviewer, awaiting_first_response, awaiting_re_review, responded, unknown]}
        since: {type: string, format: date-time}
        wait_seconds: {type: integer, minimum: 0}
        fallback_open: {type: boolean, description: Готовность MR неизвестна; ожидание считается от открытия.}
    MergeRequest:
      type: object
      required: [id, iid, title, state, draft, area, author, head_sha, opened_at, ready_at, review_wait, source_url]
      properties:
        id: {type: string, format: uuid}
        iid: {type: [integer, 'null']}
        title: {type: [string, 'null']}
        state: {type: string, enum: [open, merged, closed]}
        draft: {type: boolean}
        area: {$ref: '#/components/schemas/AreaRef'}
        author: {$ref: '#/components/schemas/ActorRef'}
        head_sha: {$ref: '#/components/schemas/GitSha'}
        opened_at: {type: string, format: date-time}
        ready_at: {type: [string, 'null'], format: date-time}
        review_wait: {$ref: '#/components/schemas/ReviewWait'}
        source_url: {type: [string, 'null'], format: uri}
        links:
          type: array
          description: Связи MR с задачами, подтверждённые и кандидаты. Передаются в `getMergeRequest`; задача без доступа у пользователя не включается.
          items: {$ref: '#/components/schemas/Link'}
    GitSha:
      type: string
      pattern: '^([0-9a-f]{40}|[0-9a-f]{64})$'
    MergeRequestPage:
      type: object
      required: [data, next_cursor, access_limited, access_notes]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/MergeRequest'}}
        next_cursor: {type: [string, 'null']}
        access_limited: {type: boolean}
        access_notes: {type: array, items: {$ref: '#/components/schemas/AccessNote'}}
    CodeLocation:
      type: [object, 'null']
      required: [path, line_start, line_end]
      properties:
        path: {type: string}
        line_start: {type: [integer, 'null'], minimum: 1}
        line_end: {type: [integer, 'null'], minimum: 1}
    SummaryItem:
      type: object
      required: [item_no, item_kind, finding_id, rule_id, severity, location, rank]
      properties:
        item_no: {"type":"integer","minimum":1,"description":"Номер в отфильтрованной сводке, начиная с 1. Номер строки хранилища не выдаётся."}
        item_kind: {type: string, enum: [new, resolved, newly_observed, unchanged, accepted, not_evaluated, ci_attempts, coverage, tests], description: '`accepted` - находка с действующим исключением: она остаётся в сводке отдельно и не считается исправленной.'}
        analysis_kind: {$ref: '#/components/schemas/AnalysisKind', description: Вид анализа строки; отсутствует у строк попыток CI.}
        mode: {type: string, enum: [import, builtin], description: Отчёт клиента или штатный профиль; передаётся для строк находок и непроверенных областей.}
        finding_id: {type: [string, 'null'], format: uuid}
        rule_id: {type: [string, 'null']}
        severity: {type: [string, 'null'], description: Сопоставленная серьёзность; исходная - в карточке находки.}
        location: {$ref: '#/components/schemas/CodeLocation'}
        rank: {type: [integer, 'null'], description: "Порядок среди пяти важнейших разрешённых сигналов после фильтрации по аудитории (FR-060); без пропусков от скрытых строк."}
    MergeRequestSummary:
      type: object
      required: ["id","merge_request_id","revision_no","status","head_sha","base_sha","pipeline_state","built_at","stale_reason","items","not_evaluated","coverage_changed_lines","ci","publication","redactions","access_limited","access_notes"]
      properties:
        id: {type: string, format: uuid}
        merge_request_id: {type: string, format: uuid}
        revision_no: {type: integer, minimum: 1}
        status: {type: string, enum: [building, ready, stale, superseded]}
        head_sha: {$ref: '#/components/schemas/GitSha'}
        base_sha: {type: [string, 'null'], pattern: '^([0-9a-f]{40}|[0-9a-f]{64})$', description: '`null` - сопоставимой базы нет; находки `newly_observed`.'}
        pipeline_state: {type: string, enum: [running, complete, reports_missing]}
        built_at: {type: [string, 'null'], format: date-time}
        stale_reason: {type: [string, 'null'], description: '`new_head` - пришёл новый коммит; сводка не публикуется.'}
        items: {type: array, items: {$ref: '#/components/schemas/SummaryItem'}}
        not_evaluated:
          type: array
          items:
            type: object
            required: [analysis_kind, reason_code]
            properties:
              analysis_kind: {$ref: '#/components/schemas/AnalysisKind'}
              reason_code: {type: string}
        coverage_changed_lines: {$ref: '#/components/schemas/MetricValue'}
        change:
          type: object
          description: Размер и структура изменения относительно базы (C15-C17). Значение без сопоставимой базы или анализа имеет состояние `NOT_EVALUATED`.
          required: [lines_added, lines_removed, files_changed, complexity_increased_functions, new_clone_groups]
          properties:
            lines_added: {$ref: '#/components/schemas/MetricValue'}
            lines_removed: {$ref: '#/components/schemas/MetricValue'}
            files_changed: {$ref: '#/components/schemas/MetricValue'}
            complexity_increased_functions: {$ref: '#/components/schemas/MetricValue'}
            new_clone_groups: {$ref: '#/components/schemas/MetricValue'}
        tests:
          type: object
          description: Исходы тестов head по отчётам JUnit (I19); без отчёта значения `NOT_EVALUATED`.
          required: [passed, failed, errored, skipped]
          properties:
            passed: {$ref: '#/components/schemas/MetricValue'}
            failed: {$ref: '#/components/schemas/MetricValue'}
            errored: {$ref: '#/components/schemas/MetricValue'}
            skipped: {$ref: '#/components/schemas/MetricValue'}
        expected:
          type: object
          description: Ожидаемый состав проверок и отчётов профиля (I08/I09).
          required: [missing_checks, missing_reports]
          properties:
            missing_checks: {$ref: '#/components/schemas/MetricValue'}
            missing_reports: {$ref: '#/components/schemas/MetricValue'}
        last_good:
          type: [object, 'null']
          description: Последняя ревизия MR с полным набором ожидаемых отчётов; показывается отдельно с датой и не переносится на текущий head.
          required: [head_sha, revision_no, built_at]
          properties:
            head_sha: {$ref: '#/components/schemas/GitSha'}
            revision_no: {type: integer, minimum: 1}
            built_at: {type: string, format: date-time}
        ci:
          type: [object, 'null']
          required: [pipeline_id, outcome, attempts, retried_jobs]
          properties:
            pipeline_id: {type: string, format: uuid}
            outcome: {type: string, enum: [running, success, failed, canceled, skipped, unknown]}
            attempts: {type: integer}
            retried_jobs: {type: integer}
            parent_pipeline_id: {type: [string, 'null'], format: uuid, description: 'Родительский pipeline у дочернего.'}
        publication:
          type: object
          required: [status, external_id, error_code, published_at]
          properties:
            status: {type: string, enum: [not_requested, pending, succeeded, failed, unknown, stale]}
            external_id: {type: [string, 'null']}
            error_code: {type: [string, 'null'], description: '`write_permission_missing`, `head_changed`, `provider_error`.'}
            published_at: {type: [string, 'null'], format: date-time}
        redactions: {$ref: '#/components/schemas/Redactions'}
        access_limited:
          type: boolean
          description: Часть строк скрыта правами; число и позиции скрытых строк не выдаются.
        access_notes:
          type: array
          items:
            $ref: "#/components/schemas/AccessNote"
    Pipeline:
      type: object
      required: [id, ref_name, sha, merge_request_id, outcome, native_status, started_at, finished_at, attempts_total, retried_jobs, allowed_failures, attempt_history, reports, tests, source_url]
      properties:
        id: {type: string, format: uuid}
        ref_name: {type: string}
        sha: {$ref: '#/components/schemas/GitSha'}
        merge_request_id: {type: [string, 'null'], format: uuid}
        outcome: {type: string, enum: [running, success, failed, canceled, skipped, unknown]}
        native_status: {type: string}
        started_at: {type: [string, 'null'], format: date-time}
        finished_at: {type: [string, 'null'], format: date-time}
        attempts_total: {type: integer}
        retried_jobs: {type: integer}
        allowed_failures: {type: integer}
        attempt_history: {type: string, enum: [complete, truncated, unknown], description: '`truncated` - внутренние повторы известны не все (например, Jenkins без манифеста).'}
        reports:
          type: array
          items:
