          multipart/form-data:
            schema: {$ref: '#/components/schemas/ImportUpload'}
            encoding:
              file: {contentType: 'application/json, text/csv, application/xml, text/plain'}
      responses:
        '202':
          description: Пакет принят к разбору.
          headers:
            Location: {$ref: '#/components/headers/Location'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReceiptAccepted'}
