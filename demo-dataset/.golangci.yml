version: "2"

run:
  timeout: 5m
  go: "1.27"
  tests: true

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - unused
    - depguard
  settings:
    depguard:
      rules:
        independent-oracle:
          deny:
            - pkg: github.com/Avtobot22/craftPulse/backend
              desc: Expected values must be independent of the backend calculation.

formatters:
  enable:
    - gofmt
