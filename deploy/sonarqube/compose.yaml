name: craftpulse-sonarqube90
services:
  db:
    image: postgres:17.12-alpine3.23@sha256:318b8c3c90e13b6fc3a1e57b9bd260965ad578d46401b1b3cfdcc4e17ac81a3f
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 256m
    memswap_limit: 384m
    environment:
      POSTGRES_DB: sonarqube
      POSTGRES_USER: sonarqube
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    volumes:
      - db_data:/var/lib/postgresql/data
    secrets: [db_password]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U sonarqube -d sonarqube]
      interval: 10s
      timeout: 5s
      retries: 10
  sonarqube:
    image: sonarqube:26.11.0.134175-community@sha256:65541accbdb92e27fe770fc6ba99988a3dd5a0c71ffafd67f88abfad366996fa
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    cpus: 1.0
    mem_limit: 1792m
    memswap_limit: 2816m
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://db:5432/sonarqube
      SONAR_JDBC_USERNAME: sonarqube
      SONAR_WEB_JAVAOPTS: -Xms128m -Xmx384m
      SONAR_CE_JAVAOPTS: -Xms128m -Xmx384m
      SONAR_SEARCH_JAVAOPTS: -Xms256m -Xmx256m
      SONAR_WEB_CONTEXT: ''
    entrypoint: [/bin/bash, -c]
    command:
      - 'export SONAR_JDBC_PASSWORD="$$(cat /run/secrets/db_password)"; exec /opt/sonarqube/docker/entrypoint.sh'
    ports:
      - 127.0.0.1:9002:9000
    volumes:
      - sonar_data:/opt/sonarqube/data
      - sonar_extensions:/opt/sonarqube/extensions
      - sonar_logs:/opt/sonarqube/logs
    secrets: [db_password]
    ulimits:
      nofile:
        soft: 131072
        hard: 131072
      nproc: 8192
    healthcheck:
      test: [CMD-SHELL, 'curl --fail --silent http://localhost:9000/api/system/status | grep -q ''"status":"UP"''']
      interval: 30s
      timeout: 10s
      retries: 15
      start_period: 5m
volumes:
  db_data:
  sonar_data:
  sonar_extensions:
  sonar_logs:
secrets:
  db_password:
    file: ${SONAR_DB_PASSWORD_FILE:?Set the private database password file}
