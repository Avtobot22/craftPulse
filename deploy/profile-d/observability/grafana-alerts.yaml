apiVersion: 1
groups:
  - orgId: 1
    name: craftpulse-stand
    folder: craftPulse
    interval: 30s
    rules:
      - uid: cp85-api-p95
        title: API p95 выше 2 с
        condition: B
        for: 10m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: 'Проверь задержку операции {{ $labels.operation_id }}.'
          __dashboardUid__: craftpulse-overview
          __panelId__: "4"
        labels:
          severity: warning
        data:
          - refId: A
            datasourceUid: craftpulse-metrics
            relativeTimeRange: {from: 600, to: 0}
            model:
              datasource: {type: prometheus, uid: craftpulse-metrics}
              editorMode: code
              expr: >-
                histogram_quantile(0.95, sum by (operation_id, le) (rate(craftpulse_api_request_duration_seconds_bucket{service="api"}[5m])))
              instant: true
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: {from: 0, to: 0}
            model:
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              refId: B
              type: threshold
              conditions:
                - type: query
                  evaluator: {type: gt, params: [2]}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {type: last, params: []}
      - uid: cp85-river-interactive
        title: Очередь interactive ждёт дольше 2 мин
        condition: B
        for: 0s
        noDataState: OK
        execErrState: Error
        annotations:
          summary: 'Проверь загрузку worker и состояние очереди interactive.'
          __dashboardUid__: craftpulse-overview
          __panelId__: "6"
        labels:
          severity: warning
        data:
          - refId: A
            datasourceUid: craftpulse-metrics
            relativeTimeRange: {from: 600, to: 0}
            model:
              datasource: {type: prometheus, uid: craftpulse-metrics}
              editorMode: code
              expr: >-
                craftpulse_river_oldest_available_job_age_seconds{service="worker",queue="interactive"}
              instant: true
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: {from: 0, to: 0}
            model:
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              refId: B
              type: threshold
              conditions:
                - type: query
                  evaluator: {type: gt, params: [120]}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {type: last, params: []}
      - uid: cp85-river-bulk
        title: Очередь bulk ждёт дольше 1 ч
        condition: B
        for: 0s
        noDataState: OK
        execErrState: Error
        annotations:
          summary: 'Проверь загрузку worker и состояние очереди bulk.'
          __dashboardUid__: craftpulse-overview
          __panelId__: "6"
        labels:
          severity: warning
        data:
          - refId: A
            datasourceUid: craftpulse-metrics
            relativeTimeRange: {from: 600, to: 0}
            model:
              datasource: {type: prometheus, uid: craftpulse-metrics}
              editorMode: code
              expr: >-
                craftpulse_river_oldest_available_job_age_seconds{service="worker",queue="bulk"}
              instant: true
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: {from: 0, to: 0}
            model:
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              refId: B
              type: threshold
              conditions:
                - type: query
                  evaluator: {type: gt, params: [3600]}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {type: last, params: []}
      - uid: cp85-river-discard
        title: Задание River исчерпало повторы
        condition: B
        for: 0s
        noDataState: OK
        execErrState: Error
        annotations:
          summary: 'Проверь ошибки заданий в очереди {{ $labels.queue }}.'
          __dashboardUid__: craftpulse-overview
          __panelId__: "7"
        labels:
          severity: critical
        data:
          - refId: A
            datasourceUid: craftpulse-metrics
            relativeTimeRange: {from: 600, to: 0}
            model:
              datasource: {type: prometheus, uid: craftpulse-metrics}
              editorMode: code
              expr: >-
                craftpulse_river_discarded_jobs{service="worker"}
              instant: true
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: {from: 0, to: 0}
            model:
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              refId: B
              type: threshold
              conditions:
                - type: query
                  evaluator: {type: gt, params: [0]}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {type: last, params: []}
      - uid: cp85-login-failures
        title: Растёт доля неудачных входов
        condition: B
        for: 0s
        noDataState: OK
        execErrState: Error
        annotations:
          summary: 'Проверь вход через {{ $labels.provider }}. Доля ошибок выросла более чем на 20 п.п. при пяти и более исходах за 5 мин.'
          __dashboardUid__: craftpulse-overview
          __panelId__: "10"
        labels:
          severity: warning
        data:
          - refId: A
            datasourceUid: craftpulse-metrics
            relativeTimeRange: {from: 600, to: 0}
            model:
              datasource: {type: prometheus, uid: craftpulse-metrics}
              editorMode: code
              expr: >-
                ((sum by (provider) (increase(craftpulse_auth_login_outcomes_total{service="api",result="failed"}[5m])) / clamp_min(sum by (provider) (increase(craftpulse_auth_login_outcomes_total{service="api"}[5m])), 1)) - ((sum by (provider) (increase(craftpulse_auth_login_outcomes_total{service="api",result="failed"}[5m] offset 5m)) / clamp_min(sum by (provider) (increase(craftpulse_auth_login_outcomes_total{service="api"}[5m] offset 5m)), 1)) or on (provider) (0 * sum by (provider) (increase(craftpulse_auth_login_outcomes_total{service="api"}[5m]))))) and on (provider) (sum by (provider) (increase(craftpulse_auth_login_outcomes_total{service="api"}[5m])) >= 5)
              instant: true
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: {from: 0, to: 0}
            model:
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              refId: B
              type: threshold
              conditions:
                - type: query
                  evaluator: {type: gt, params: [0.2]}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {type: last, params: []}
      - uid: cp85-access-denied
        title: Растёт число отказов в доступе
        condition: B
        for: 0s
        noDataState: OK
        execErrState: Error
        annotations:
          summary: 'Субъект {{ $labels.subject }} получил как минимум на пять отказов больше, чем в предыдущие 5 мин.'
          __dashboardUid__: craftpulse-overview
          __panelId__: "11"
        labels:
          severity: warning
        data:
          - refId: A
            datasourceUid: craftpulse-metrics
            relativeTimeRange: {from: 600, to: 0}
            model:
              datasource: {type: prometheus, uid: craftpulse-metrics}
              editorMode: code
              expr: >-
                sum by (subject) (increase(craftpulse_api_access_denied_total{service="api"}[5m])) - (sum by (subject) (increase(craftpulse_api_access_denied_total{service="api"}[5m] offset 5m)) or on (subject) (0 * sum by (subject) (increase(craftpulse_api_access_denied_total{service="api"}[5m]))))
              instant: true
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: {from: 0, to: 0}
            model:
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              refId: B
              type: threshold
              conditions:
                - type: query
                  evaluator: {type: gte, params: [5]}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {type: last, params: []}
      - uid: cp85-container-memory
        title: Память контейнера выше 90% лимита
        condition: B
        for: 0s
        noDataState: OK
        execErrState: Error
        annotations:
          summary: 'Рабочий набор контейнера {{ $labels.container }} превысил 90% лимита памяти.'
          __dashboardUid__: craftpulse-overview
          __panelId__: "8"
        labels:
          severity: warning
        data:
          - refId: A
            datasourceUid: craftpulse-metrics
            relativeTimeRange: {from: 600, to: 0}
            model:
              datasource: {type: prometheus, uid: craftpulse-metrics}
              editorMode: code
              expr: >-
                max by (service, container) (container_memory_working_set_bytes / (container_spec_memory_limit_bytes > 0))
              instant: true
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: {from: 0, to: 0}
            model:
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              refId: B
              type: threshold
              conditions:
                - type: query
                  evaluator: {type: gt, params: [0.9]}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {type: last, params: []}
      - uid: cp-outbound-publication-late
        title: Публикация комментария MR заняла больше двух минут
        condition: B
        for: 0s
        noDataState: OK
        execErrState: Error
        annotations:
          summary: За последние 10 минут комментарий MR опубликован позже 120 секунд после готовности отчётов (NFR-04).
        labels:
          severity: warning
        data:
          - refId: A
            datasourceUid: craftpulse-metrics
            relativeTimeRange: {from: 600, to: 0}
            model:
              datasource: {type: prometheus, uid: craftpulse-metrics}
              editorMode: code
              expr: >-
                sum(increase(craftpulse_outbound_report_to_publish_seconds_count{service="worker"}[10m])) -
                sum(increase(craftpulse_outbound_report_to_publish_seconds_bucket{service="worker",le="120"}[10m]))
              instant: true
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: {from: 0, to: 0}
            model:
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              refId: B
              type: threshold
              conditions:
                - type: query
                  evaluator: {type: gt, params: [0]}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {type: last, params: []}
  - orgId: 1
    name: craftpulse-collection
    folder: craftPulse
    interval: 30s
    rules:
      - uid: cp-collection-stale
        title: Сбор не завершался успешно больше 26 ч
        condition: B
        for: 0s
        noDataState: OK
        execErrState: Error
        annotations:
          summary: 'У подключения {{ $labels.connection_id }} отстал сбор {{ $labels.data_kind }}.'
          __dashboardUid__: craftpulse-collection
          __panelId__: "1"
        labels:
          severity: warning
        data:
          - refId: A
            datasourceUid: craftpulse-metrics
            relativeTimeRange: {from: 600, to: 0}
            model:
              datasource: {type: prometheus, uid: craftpulse-metrics}
              editorMode: code
              expr: >-
                craftpulse_sync_seconds_since_success{service="worker"}
              instant: true
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: {from: 0, to: 0}
            model:
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              refId: B
              type: threshold
              conditions:
                - type: query
                  evaluator: {type: gt, params: [93600]}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {type: last, params: []}
      - uid: cp-collection-auth
        title: Источник отклонил учётные данные сбора
        condition: B
        for: 0s
        noDataState: OK
        execErrState: Error
        annotations:
          summary: 'Проверь токен и права сборщика. Источник ответил 401 или 403.'
          __dashboardUid__: craftpulse-collection
          __panelId__: "3"
        labels:
          severity: warning
        data:
          - refId: A
            datasourceUid: craftpulse-metrics
            relativeTimeRange: {from: 600, to: 0}
            model:
              datasource: {type: prometheus, uid: craftpulse-metrics}
              editorMode: code
              expr: >-
                time() - max(craftpulse_sync_last_auth_error_timestamp_seconds{service="worker"})
              instant: true
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: {from: 0, to: 0}
            model:
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              refId: B
              type: threshold
              conditions:
                - type: query
                  evaluator: {type: lt, params: [300]}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {type: last, params: []}
      - uid: cp-collection-errors
        title: Ошибки сбора растут больше часа
        condition: B
        for: 1h
        noDataState: OK
        execErrState: Error
        annotations:
          summary: 'Класс ошибки {{ $labels.class }}. Для adapter_unavailable проверь адаптер и его TLS.'
          __dashboardUid__: craftpulse-collection
          __panelId__: "3"
        labels:
          severity: warning
        data:
          - refId: A
            datasourceUid: craftpulse-metrics
            relativeTimeRange: {from: 600, to: 0}
            model:
              datasource: {type: prometheus, uid: craftpulse-metrics}
              editorMode: code
              expr: >-
                sum by (class) (increase(craftpulse_sync_errors_total{service="worker",class!="auth"}[5m]))
              instant: true
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: {from: 0, to: 0}
            model:
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              refId: B
              type: threshold
              conditions:
                - type: query
                  evaluator: {type: gt, params: [0]}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {type: last, params: []}
      - uid: cp-source-access-errors
        title: Проверка прав источника завершается ошибкой дольше 5 мин
        condition: B
        for: 5m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: 'Проверь источник подключения {{ $labels.connection_id }}.'
          __dashboardUid__: craftpulse-collection
          __panelId__: "4"
        labels:
          severity: warning
        data:
          - refId: A
            datasourceUid: craftpulse-metrics
            relativeTimeRange: {from: 600, to: 0}
            model:
              datasource: {type: prometheus, uid: craftpulse-metrics}
              editorMode: code
              expr: >-
                sum by (connection_id) (increase(craftpulse_access_check_failures_total[2m]))
              instant: true
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: {from: 0, to: 0}
            model:
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              refId: B
              type: threshold
              conditions:
                - type: query
                  evaluator: {type: gt, params: [0]}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {type: last, params: []}
      - uid: cp-ingest-rejection-share
        title: Растёт доля отклонённых пакетов
        condition: B
        for: 0s
        noDataState: OK
        execErrState: Error
        annotations:
          summary: 'Доля отклонений канала {{ $labels.channel }} выросла более чем на 20 п.п. между соседними окнами по 5 минут.'
          __dashboardUid__: craftpulse-collection
          __panelId__: "5"
        labels:
          severity: warning
        data:
          - refId: A
            datasourceUid: craftpulse-metrics
            relativeTimeRange: {from: 600, to: 0}
            model:
              datasource: {type: prometheus, uid: craftpulse-metrics}
              editorMode: code
              expr: >-
                (
                  sum by (channel) (increase(craftpulse_ingest_resolved_packages_total{status="rejected"}[5m]))
                  / sum by (channel) (increase(craftpulse_ingest_resolved_packages_total[5m]))
                  -
                  sum by (channel) (increase(craftpulse_ingest_resolved_packages_total{status="rejected"}[5m] offset 5m))
                  / (sum by (channel) (increase(craftpulse_ingest_resolved_packages_total[5m] offset 5m)) > 0)
                ) and on (channel) (sum by (channel) (increase(craftpulse_ingest_resolved_packages_total[5m])) >= 5)
              instant: true
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: {from: 0, to: 0}
            model:
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              refId: B
              type: threshold
              conditions:
                - type: query
                  evaluator: {type: gt, params: [0.2]}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {type: last, params: []}
      - uid: cp-jira-cert-expiry
        title: Сертификат адаптера Jira Cloud истекает меньше чем через 30 дней
        condition: B
        for: 0s
        noDataState: OK
        execErrState: Error
        annotations:
          summary: 'Перевыпусти сертификат {{ $labels.service }} внутренним центром установки.'
          __dashboardUid__: craftpulse-collection
          __panelId__: "7"
        labels:
          severity: warning
        data:
          - refId: A
            datasourceUid: craftpulse-metrics
            relativeTimeRange: {from: 600, to: 0}
            model:
              datasource: {type: prometheus, uid: craftpulse-metrics}
              editorMode: code
              expr: >-
                min by (service) (craftpulse_adapter_tls_not_after_timestamp_seconds) - time()
              instant: true
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: {from: 0, to: 0}
            model:
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              refId: B
              type: threshold
              conditions:
                - type: query
                  evaluator: {type: lt, params: [2592000]}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {type: last, params: []}
