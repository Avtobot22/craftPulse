name: craftpulse-profile-d

x-runtime: &runtime
  restart: unless-stopped
  cgroup_parent: ${CGROUP_PARENT:-}

x-logging: &logs
  driver: syslog
  options:
    syslog-address: udp://127.0.0.1:${SYSLOG_PORT:-19514}
    syslog-format: rfc5424micro
    tag: "{{.Name}}"
    mode: non-blocking

x-core-env: &core-env
  HTTP_ADDR: ":8080"
  METRICS_ADDR: ":9090"
  DATABASE_MAX_CONNS: "10"
  DATABASE_PASSWORD_FILE: /run/secrets/db-password
  CORE_MASTER_KEY_VERSION: "1"
  CORE_MASTER_KEY_FILE: /run/secrets/core-master-key
  OBJECT_STORE_ENDPOINT: http://seaweedfs:8333
  OBJECT_STORE_BUCKET: craftpulse
  OBJECT_STORE_REGION: us-east-1
  OBJECT_STORE_ACCESS_KEY_ID: craftpulse
  OBJECT_STORE_SECRET_ACCESS_KEY_FILE: /run/secrets/object-key
  SITE_URL: ${SITE_URL:-https://localhost:18443}
  TRUSTED_PROXIES: 172.31.84.10
  RUNNER_NETWORK: ${RUNNER_NETWORK:-}

x-core: &core
  <<: *runtime
  extra_hosts:
    - gitlab.defects.team:host-gateway
  networks: [data, edge]
  logging: *logs
  volumes:
    - ${SECRETS_DIR:?Set SECRETS_DIR}/app-password:/run/secrets/db-password:ro
    - ${SECRETS_DIR:?Set SECRETS_DIR}/core-master-key:/run/secrets/core-master-key:ro
    - ${SECRETS_DIR:?Set SECRETS_DIR}/object-key:/run/secrets/object-key:ro
  depends_on:
    migrate:
      condition: service_completed_successfully
    seaweedfs:
      condition: service_healthy

services:
  postgres:
    <<: *runtime
    image: postgres:18.7-alpine3.23@sha256:339a86bf416979bb4d3d2e30a1f9e096e7302564faff4151b804cf53463059d5
    mem_limit: 1536m
    memswap_limit: 1536m
    shm_size: 192m
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - work_mem=8MB
      - -c
      - max_connections=40
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - log_min_duration_statement=1000
      - -c
      - log_parameter_max_length=0
      - -c
      - log_lock_waits=on
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
      CRAFTPULSE_OWNER_PASSWORD_FILE: /run/secrets/owner-password
      CRAFTPULSE_APP_PASSWORD_FILE: /run/secrets/app-password
      CRAFTPULSE_BACKUP_PASSWORD_FILE: /run/secrets/backup-password
    volumes:
      - postgres:/var/lib/postgresql
      - ../postgres/init.sh:/docker-entrypoint-initdb.d/10-craftpulse.sh:ro
      - ./postgres-statements.sql:/docker-entrypoint-initdb.d/20-statements.sql:ro
      - ${SECRETS_DIR:?Set SECRETS_DIR}/postgres-password:/run/secrets/postgres-password:ro
      - ${SECRETS_DIR:?Set SECRETS_DIR}/postgres-owner-password:/run/secrets/owner-password:ro
      - ${SECRETS_DIR:?Set SECRETS_DIR}/postgres-app-password:/run/secrets/app-password:ro
      - ${SECRETS_DIR:?Set SECRETS_DIR}/postgres-backup-password:/run/secrets/backup-password:ro
    networks: [data]
    healthcheck:
      test: [CMD, pg_isready, -h, "127.0.0.1", -U, postgres, -d, craftpulse]
      interval: 5s
      timeout: 3s
      retries: 20

  seaweedfs:
    <<: *runtime
    image: chrislusf/seaweedfs:4.55@sha256:7ca46aeae2f223b37e5d91593c17ab37738eec6df6ab69b48a0487f7643342b9
    mem_limit: 512m
    memswap_limit: 512m
    environment:
      GOMEMLIMIT: 375MiB
    command: [mini, -dir=/data, -bucket=craftpulse, -s3.config=/run/secrets/seaweedfs.json]
    volumes:
      - objects:/data
      - ${SECRETS_DIR:?Set SECRETS_DIR}/seaweedfs.json:/run/secrets/seaweedfs.json:ro
    networks: [data]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:9333/cluster/status]
      interval: 10s
      timeout: 5s
      retries: 12

  migrate:
    cgroup_parent: ${CGROUP_PARENT:-}
    restart: "no"
    mem_limit: 512m
    memswap_limit: 512m
    command: [/usr/local/bin/api, migrate]
    environment:
      <<: *core-env
      DATABASE_URL: postgres://craftpulse_owner@postgres:5432/craftpulse?sslmode=disable
      GOMEMLIMIT: 416MiB
    volumes:
      - ${SECRETS_DIR:?Set SECRETS_DIR}/owner-password:/run/secrets/db-password:ro
      - ${SECRETS_DIR:?Set SECRETS_DIR}/core-master-key:/run/secrets/core-master-key:ro
      - ${SECRETS_DIR:?Set SECRETS_DIR}/object-key:/run/secrets/object-key:ro
    networks: [data]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *core
    command: [/usr/local/bin/api]
    mem_limit: 512m
    memswap_limit: 512m
    environment:
      CHECK_PROFILES_FILE: /etc/craftpulse/check-profiles.yaml
      <<: *core-env
      DATABASE_URL: postgres://craftpulse_app@postgres:5432/craftpulse?sslmode=disable
      GOMEMLIMIT: 416MiB
    healthcheck:
      test: [CMD, /usr/local/bin/api, healthcheck]
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    <<: *core
    command: [/usr/local/bin/worker]
    mem_limit: 1024m
    memswap_limit: 1024m
    cpus: 2.0
    stop_grace_period: 90s
    environment:
      <<: *core-env
      DATABASE_URL: postgres://craftpulse_app@postgres:5432/craftpulse?sslmode=disable
      GOMEMLIMIT: 850MiB
    ports: ["127.0.0.1:${WORKER_PROBE_PORT:-18082}:8080"]
    healthcheck:
      test: [CMD, /usr/local/bin/worker, healthcheck]
      interval: 10s
      timeout: 3s
      retries: 5

  nginx:
    <<: *runtime
    mem_limit: 96m
    memswap_limit: 96m
    environment:
      CRAFTPULSE_SITE_URL: ${SITE_URL:-https://localhost:18443}
      CRAFTPULSE_EDGE_PROXY_IP: ${EDGE_PROXY_IP:-127.0.0.1}
      NGINX_ENVSUBST_FILTER: "^CRAFTPULSE_"
    ports:
      - "${BIND_IP:-127.0.0.1}:${HTTP_PORT:-18080}:8080"
      - "${BIND_IP:-127.0.0.1}:${HTTPS_PORT:-18443}:8443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/profile.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ${SECRETS_DIR:?Set SECRETS_DIR}/tls-cert.pem:/run/secrets/tls-cert.pem:ro
      - ${SECRETS_DIR:?Set SECRETS_DIR}/tls-key.pem:/run/secrets/tls-key.pem:ro
    networks:
      edge:
        ipv4_address: 172.31.84.10
    depends_on:
      api:
        condition: service_healthy
    logging: *logs
    healthcheck:
      test: [CMD, wget, -q, --no-check-certificate, -O, /dev/null, https://127.0.0.1:8443/readyz]
      interval: 10s
      timeout: 5s
      retries: 5

  victoriametrics:
    <<: *runtime
    image: victoriametrics/victoria-metrics:v1.156.0@sha256:da8a90ac0912f16589be2b96a6441a2fca4bca415c83783d972d92e3b5b66970
    mem_limit: 256m
    memswap_limit: 256m
    environment:
      GOMEMLIMIT: 180MiB
    command: [-storageDataPath=/data, -retentionPeriod=13, -promscrape.config=/etc/victoriametrics/scrape.yaml, -memory.allowedBytes=64MiB, -search.maxConcurrentRequests=2]
    volumes:
      - metrics:/data
      - ./observability/scrape.yaml:/etc/victoriametrics/scrape.yaml:ro
    networks: [data]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8428/health]
      interval: 10s
      timeout: 5s
      retries: 5

  victorialogs:
    <<: *runtime
    image: victoriametrics/victoria-logs:v1.54.0@sha256:ee4e820cac3721f5f5d91641b950c22439593adc4224f9655e5333d5a84c1dfe
    mem_limit: 256m
    memswap_limit: 256m
    environment:
      GOMEMLIMIT: 180MiB
    command: [-storageDataPath=/data, -retentionPeriod=30d, -memory.allowedBytes=64MiB, -search.maxConcurrentRequests=2, -syslog.listenAddr.udp=:1514]
    volumes: [logs:/data]
    networks: [data, edge]
    ports:
      - "127.0.0.1:${LOGS_PORT:-19428}:9428"
      - "127.0.0.1:${SYSLOG_PORT:-19514}:1514/udp"
    healthcheck:
      test: [CMD, /victoria-logs-prod, -healthcheck, -httpListenAddr=127.0.0.1:9428]
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    <<: *runtime
    image: grafana/grafana:13.3.1@sha256:0615ec4fbd4072004b7d86b46ded63013a74b7d6eb1119273dd89e8fa25c13cf
    mem_limit: 512m
    memswap_limit: 512m
    environment:
      GOMEMLIMIT: 370MiB
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana-password
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
    volumes:
      - grafana:/var/lib/grafana
      - ${SECRETS_DIR:?Set SECRETS_DIR}/grafana-password:/run/secrets/grafana-password:ro
      - ./observability/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/craftpulse.yaml:ro
      - ./observability/grafana-dashboards.yaml:/etc/grafana/provisioning/dashboards/craftpulse.yaml:ro
      - ./observability/grafana-overview.json:/etc/grafana/craftpulse-dashboards/overview.json:ro
    networks: [data, edge]
    ports: ["127.0.0.1:${GRAFANA_PORT:-13000}:3000"]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:3000/api/health]
      interval: 10s
      timeout: 5s
      retries: 12

networks:
  data:
    internal: true
  edge:
    ipam:
      config:
        - subnet: 172.31.84.0/27

volumes:
  postgres:
  objects:
  metrics:
  logs:
  grafana:
